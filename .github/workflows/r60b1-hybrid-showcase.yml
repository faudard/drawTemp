name: R60.B1 Hybrid Showcase (headless evidence only)
on:
  pull_request:
    paths:
      - "drawtemp/creator_examples/r60_showcase.py"
      - "drawtemp/export/templates.py"
      - "examples/r60_production_showcase.py"
      - "tests_standalone/test_r60_hybrid_showcase.py"
      - ".github/workflows/r60b1-hybrid-showcase.yml"
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybrid-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R60 native hybrid authoring and replay tests
        run: python -m unittest tests_standalone.test_r60_hybrid_showcase -v
      - name: R53, R55 and R51 regressions
        run: python -m unittest tests_standalone.test_r53_hybrid_slice tests_standalone.test_r55_system_design tests_standalone.test_r51a_ui_layout -v
      - name: Real R60.B1 integration trace (not a certification)
        run: python -m examples.r60_production_showcase > r60b1-headless.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r60b1-headless-${{ matrix.python }}
          path: r60b1-headless.json
