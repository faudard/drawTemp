name: DrawTemp R13 Qt and Combat Lab

on:
  pull_request:
    paths:
      - "drawtemp/sdk/r13_*"
      - "drawtemp/studio/r13_*"
      - "tests_standalone/test_drawtemp5_r13*"
      - ".github/workflows/r13-combat-lab.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/sdk/r13_*"
      - "drawtemp/studio/r13_*"
      - "tests_standalone/test_drawtemp5_r13*"

permissions:
  contents: read

jobs:
  r13-headless:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R13 replay, scenario isolation, regression gate
        run: python -m unittest tests_standalone.test_drawtemp5_r13 -v
      - name: R13 CLI real Jeanne/core evidence and replay
        run: |
          python -m drawtemp.sdk.r13_cli --content sporebound/content/core.json --mission garden --seed-start 1 --runs 2 --limit 35 --trace --report r13.json
          python -m drawtemp.sdk.r13_cli --content sporebound/content/core.json --mission garden --seed-start 1 --runs 2 --limit 35 --baseline r13.json
  r13-qt:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt EGL/OpenGL runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: R13 Qt Widgets actual window smoke
        run: python -m unittest tests_standalone.test_drawtemp5_r13_qt -v
