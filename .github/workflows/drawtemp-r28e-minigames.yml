name: DrawTemp R28.E minigames certification

on:
  pull_request:
    paths:
      - 'drawtemp/studio/r28e_minigames.py'
      - 'drawtemp/studio/r28e_minigames_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r28e_minigames_certification.py'
      - '.github/workflows/drawtemp-r28e-minigames.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/r28e_minigames.py'
      - 'drawtemp/studio/r28e_minigames_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r28e_minigames_certification.py'
      - '.github/workflows/drawtemp-r28e-minigames.yml'

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: R28.E reference projects and strict NO-GO certification
        run: python -m unittest tests_standalone.test_r28e_minigames_certification -v
      - name: R15 template regressions
        run: python -m unittest tests_standalone.test_drawtemp5_r15_creator -v

  qt-minigames:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - run: python -m pip install -e ".[qt6]"
      - name: Qt gallery and shell navigation on three OS
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_r28e_minigames_certification
          tests_standalone.test_drawtemp5_r2
          -v
      - name: Studio minigame gallery smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace minigames
