name: DrawTemp R29B Gameplay Lab and Softlock QA

on:
  pull_request:
    paths:
      - 'drawtemp/quality/r29b_gameplay.py'
      - 'scripts/audit_r29b_gameplay.py'
      - 'tests_standalone/test_r29b_gameplay.py'
      - 'tests_standalone/fixtures/r29b_action_ruins.json'
      - 'docs/drawtemp5/R29B_GAMEPLAY_LAB.md'
      - '.github/workflows/drawtemp-r29b-gameplay.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-space-matrix:
    name: R29B headless / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install in-tree DrawTemp package
        run: python -m pip install .
      - name: Test key-door reachability, dead-end branches and fail-closed budgets
        run: python -m unittest tests_standalone.test_r29b_gameplay -v
      - name: Audit authored R26-schema reference scene, emit real witness
        run: >-
          python scripts/audit_r29b_gameplay.py
          --scene tests_standalone/fixtures/r29b_action_ruins.json
          --goal 4,2 --require-solved --report r29b/action-ruins-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29b-${{ matrix.os }}
          path: r29b/
          if-no-files-found: warn
