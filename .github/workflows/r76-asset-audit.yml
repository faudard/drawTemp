name: R76.A–C1 Asset Optimization

on:
  push:
    paths:
      - "drawtemp/assets/optimization_audit.py"
      - "drawtemp/assets/optimizer.py"
      - "drawtemp/quality/r76_bench.py"
      - "drawtemp/studio/r76_bench_qt.py"
      - "tests_standalone/test_r76c_bench.py"
      - "tests_standalone/test_r76c_bench_qt.py"
      - "docs/R76C_BUNDLE_AND_STARTUP_BENCH.md"
      - "drawtemp/studio/r76_optimizer_qt.py"
      - "drawtemp/studio/qt_shell.py"
      - "tests_standalone/test_r76b_optimizer.py"
      - "tests_standalone/test_r76b_optimizer_qt.py"
      - "docs/R76B_OPTIMIZER_STUDIO.md"
      - "tests_standalone/test_r76_asset_audit.py"
      - "docs/R76A_ASSET_BUILD_AUDIT.md"
      - ".github/workflows/r76-asset-audit.yml"
  pull_request:
    paths:
      - "drawtemp/assets/optimization_audit.py"
      - "drawtemp/assets/optimizer.py"
      - "drawtemp/quality/r76_bench.py"
      - "drawtemp/studio/r76_bench_qt.py"
      - "tests_standalone/test_r76c_bench.py"
      - "tests_standalone/test_r76c_bench_qt.py"
      - "docs/R76C_BUNDLE_AND_STARTUP_BENCH.md"
      - "drawtemp/studio/r76_optimizer_qt.py"
      - "drawtemp/studio/qt_shell.py"
      - "tests_standalone/test_r76_asset_audit.py"
      - "tests_standalone/test_r76b_optimizer.py"
      - "tests_standalone/test_r76b_optimizer_qt.py"
      - "docs/R76A_ASSET_BUILD_AUDIT.md"
      - "docs/R76B_OPTIMIZER_STUDIO.md"
      - ".github/workflows/r76-asset-audit.yml"
  workflow_dispatch:

jobs:
  audit-headless:
    name: Audit headless (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: R76.A–C1 — headless and subprocess contracts
        run: python -m unittest -v tests_standalone.test_r76_asset_audit tests_standalone.test_r76b_optimizer tests_standalone.test_r76c_bench tests_standalone.test_drawtemp5_r15
      - name: Regression — canonical assets
        run: python -m unittest -v tests_standalone.test_assets

  qt-offscreen:
    name: R76.B1 Qt offscreen (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editor Qt dependencies
        run: python -m pip install -e ".[qt6]"
      - name: Qt optimizer and benchmark report dialogue smoke
        run: python -m unittest -v tests_standalone.test_r76b_optimizer_qt tests_standalone.test_r76c_bench_qt
