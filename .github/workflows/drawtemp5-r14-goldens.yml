name: DrawTemp 5 R14.5 Visual Goldens
on:
  pull_request:
    paths:
      - '.github/workflows/drawtemp5-r14-goldens.yml'
      - 'drawtemp/quality/**'
      - 'drawtemp/render/**'
      - 'drawtemp/player/**'
      - 'drawtemp/studio/**'
      - 'scripts/r14_visual_goldens.py'
      - 'tests_standalone/test_drawtemp5_r14_goldens.py'
      - 'tests_standalone/goldens/r14/**'
      - 'sporebound/content/**'
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      require_approved:
        description: 'Fail if reviewed baseline is absent or a pixel regression is detected'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: r14-goldens-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-matrix:
    name: R14.5 / ${{ matrix.os }} / Qt 6.8.3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt loader
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install pinned Qt 6
        run: python -m pip install ".[qt6]"
      - name: Verify reviewed-baseline and pixel-comparison contracts
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_drawtemp5_r14_visual tests_standalone.test_drawtemp5_r14_goldens -v
      - name: Capture 12 real Qt frames and compare reviewed baselines, if present
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python scripts/r14_visual_goldens.py capture --output r14-goldens-report
      - name: Strict manually requested certification check
        if: github.event_name == 'workflow_dispatch' && inputs.require_approved
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python scripts/r14_visual_goldens.py capture --output r14-goldens-strict --require-approved
      - name: Publish captures, JSON, HTML and PNG heatmaps
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-5-${{ matrix.os }}
          path: |
            r14-goldens-report/
            r14-goldens-strict/
          if-no-files-found: error
          retention-days: 30
