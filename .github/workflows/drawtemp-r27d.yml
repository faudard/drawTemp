name: DrawTemp R27.D Campaign Journey
on:
  pull_request:
    paths:
      - 'drawtemp/studio/dungeon_journey.py'
      - 'drawtemp/studio/dungeon_dock.py'
      - 'scripts/r27_dungeon_journey.py'
      - 'tests_standalone/test_drawtemp5_r27d_journey.py'
      - 'tests_standalone/test_drawtemp5_r27_qt.py'
      - 'docs/drawtemp5/R27D_CAMPAIGN_JOURNEY.md'
      - '.github/workflows/drawtemp-r27d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R27.D full campaign route, actual boss, story isolation and replay
        run: python -m unittest tests_standalone.test_drawtemp5_r27d_journey -v
      - name: R27.B/C puzzle and Player lifecycle gates
        run: python -m unittest tests_standalone.test_drawtemp5_r27_puzzles tests_standalone.test_drawtemp5_r27c_player -v
      - name: Generate real Content + GameProject without handwritten JSON
        run: python -m scripts.r27_dungeon_journey --output /tmp/amber.json --prefix ambercli
      - name: Existing campaign/Player test subset
        run: python -m unittest tests_standalone.test_drawtemp5_r12 tests_standalone.test_game_session -v

  studio-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: Actual Qt studio wizard and shared viewport
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          DRAWTEMP_R27_QT_SMOKE: '1'
        run: python -m unittest tests_standalone.test_drawtemp5_r27_qt -v
