name: DrawTemp 5 R12 Player
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-player:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R12 canonical lifecycle, exploration, saves, input and preferences
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp5_r12
          tests_standalone.test_drawtemp5_r12_preferences
          tests_standalone.test_drawtemp5_r12_tactical
          -v
  qt-player-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: Launch installed standalone Player and load QML root
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m drawtemp.player.qt_app --smoke
          python -m drawtemp.player.qt_app --reference --smoke --smoke-scene battle
          python -m drawtemp.player.qt_app --smoke --smoke-scene exploration
