name: DrawTemp 5 R10 Campaign World Siege
on:
  pull_request:
    paths:
      - 'drawtemp/sdk/campaign_studio.py'
      - 'drawtemp/studio/campaign_window.py'
      - 'tests_standalone/test_drawtemp5_r10.py'
      - 'docs/drawtemp5/R10_CAMPAIGN_WORLD_SIEGE.md'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp5-r10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    name: R10 contract and campaign tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/audit_drawtemp5.py --check --strict
      - run: python -m unittest tests_standalone.test_drawtemp5_r10 tests_standalone.test_drawtemp5_r1_authoring tests_standalone.test_campaign_flow_simulation_r514 tests_standalone.test_campaign_path_certification_r515 -v
  qt6-smoke:
    name: Qt campaign workspace smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt loader deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: Qt Widgets campaign authoring smoke (software)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.campaign_window --smoke
