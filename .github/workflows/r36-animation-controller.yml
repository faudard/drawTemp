name: R36 Animation and Committed FX

on:
  pull_request:
    paths:
      - 'sporebound/animation_graph.py'
      - 'drawtemp/render/committed_fx.py'
      - 'sporebound/animation_timeline.py'
      - 'drawtemp/studio/animation_timeline_authoring.py'
      - 'drawtemp/studio/animation_timeline_qt.py'
      - 'drawtemp/render/vfx2d.py'
      - 'drawtemp/player/animation_presentation.py'
      - 'drawtemp/player/action_app.py'
      - 'drawtemp/render/r32_contact_trace.py'
      - 'drawtemp/render/cell_lighting.py'
      - 'drawtemp/assets/r36_runtime.py'
      - 'drawtemp/render/r36_frame_budget.py'
      - 'drawtemp/quality/r36_release.py'
      - 'drawtemp/export/r15.py'
      - 'scripts/r36_visual_candidates.py'
      - 'tests_standalone/test_r36_release_rights.py'
      - 'tests_standalone/test_r36_visual_candidates.py'
      - 'tests_standalone/goldens/r36/**'
      - 'tests_standalone/test_r36_sprite_rendering.py'
      - 'tests_standalone/test_r36_frame_budget.py'
      - 'tests_standalone/test_r36_cell_lighting.py'
      - 'drawtemp/render/iso_scene.py'
      - 'drawtemp/render/TopDownViewport.qml'
      - 'tests_standalone/test_r36_action_actor_binding.py'
      - 'tests_standalone/test_r36_action_actor_qt.py'
      - 'tests_standalone/test_r36_r32_contact_trace.py'
      - 'tests_standalone/test_r36_animation_timeline.py'
      - 'tests_standalone/test_r36_animation_timeline_qt.py'
      - 'tests_standalone/test_r36_vfx2d.py'
      - 'drawtemp/player/action_controller.py'
      - 'drawtemp/player/ActionPreview.qml'
      - 'tests_standalone/test_r36_committed_fx.py'
      - 'tests_standalone/test_r36_committed_fx_qt.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/studio/animation_graph_authoring.py'
      - 'drawtemp/studio/animation_graph_qt.py'
      - 'drawtemp/studio/r28d_workflow_qt.py'
      - 'tests_standalone/test_r36_animation_graph.py'
      - 'tests_standalone/test_r36_animation_graph_qt.py'
      - '.github/workflows/r36-animation-controller.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/animation_graph.py'
      - 'drawtemp/render/committed_fx.py'
      - 'sporebound/animation_timeline.py'
      - 'drawtemp/studio/animation_timeline_authoring.py'
      - 'drawtemp/studio/animation_timeline_qt.py'
      - 'drawtemp/render/vfx2d.py'
      - 'drawtemp/player/animation_presentation.py'
      - 'drawtemp/player/action_app.py'
      - 'drawtemp/render/r32_contact_trace.py'
      - 'drawtemp/render/cell_lighting.py'
      - 'drawtemp/assets/r36_runtime.py'
      - 'drawtemp/render/r36_frame_budget.py'
      - 'drawtemp/quality/r36_release.py'
      - 'drawtemp/export/r15.py'
      - 'scripts/r36_visual_candidates.py'
      - 'tests_standalone/test_r36_release_rights.py'
      - 'tests_standalone/test_r36_visual_candidates.py'
      - 'tests_standalone/goldens/r36/**'
      - 'tests_standalone/test_r36_sprite_rendering.py'
      - 'tests_standalone/test_r36_frame_budget.py'
      - 'tests_standalone/test_r36_cell_lighting.py'
      - 'drawtemp/render/iso_scene.py'
      - 'drawtemp/render/TopDownViewport.qml'
      - 'tests_standalone/test_r36_action_actor_binding.py'
      - 'tests_standalone/test_r36_action_actor_qt.py'
      - 'tests_standalone/test_r36_r32_contact_trace.py'
      - 'tests_standalone/test_r36_animation_timeline.py'
      - 'tests_standalone/test_r36_animation_timeline_qt.py'
      - 'tests_standalone/test_r36_vfx2d.py'
      - 'drawtemp/player/action_controller.py'
      - 'drawtemp/player/ActionPreview.qml'
      - 'tests_standalone/test_r36_committed_fx.py'
      - 'tests_standalone/test_r36_committed_fx_qt.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/studio/animation_graph_authoring.py'
      - 'drawtemp/studio/animation_graph_qt.py'
      - 'drawtemp/studio/r28d_workflow_qt.py'
      - 'tests_standalone/test_r36_animation_graph.py'
      - 'tests_standalone/test_r36_animation_graph_qt.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r36-headless:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile touched modules
        run: python -m compileall -q sporebound/animation_graph.py drawtemp/studio/animation_graph_authoring.py drawtemp/studio/animation_graph_qt.py drawtemp/studio/r28d_workflow_qt.py drawtemp/render/committed_fx.py drawtemp/player/action_controller.py sporebound/animation_timeline.py drawtemp/studio/animation_timeline_authoring.py drawtemp/studio/animation_timeline_qt.py drawtemp/render/vfx2d.py drawtemp/player/animation_presentation.py drawtemp/render/r32_contact_trace.py drawtemp/render/cell_lighting.py drawtemp/player/action_app.py drawtemp/assets/r36_runtime.py drawtemp/render/r36_frame_budget.py drawtemp/quality/r36_release.py scripts/r36_visual_candidates.py drawtemp/export/r15.py drawtemp/render/iso_scene.py
      - name: Animation graph deterministic and canonical persistence
        run: python -m unittest tests_standalone.test_r36_animation_graph -v
      - name: R36.B1 committed impact timing, recovery, budgets and replay
        run: python -m unittest tests_standalone.test_r36_committed_fx -v
      - name: R36.B2 timeline cues and CPU light/particle bounds
        run: python -m unittest tests_standalone.test_r36_animation_timeline tests_standalone.test_r36_vfx2d -v
      - name: R36.B3 actor pose, marker events and R32 collider contact tracing
        run: python -m unittest tests_standalone.test_r36_action_actor_binding tests_standalone.test_r36_r32_contact_trace -v
      - name: R36.B3 cell light occlusion without gameplay LOS authority
        run: python -m unittest tests_standalone.test_r36_cell_lighting -v
      - name: R36.C1 R28 PNG atlas, pivots, cache and CPU frame telemetry
        run: python -m unittest tests_standalone.test_r36_sprite_rendering tests_standalone.test_r36_frame_budget -v
      - name: R4 atlas resolution regressions
        run: python -m unittest tests_standalone.test_drawtemp5_r4_assets -v
      - name: R36.C2 R15 rights provenance, SHA and approval guards
        run: python -m unittest tests_standalone.test_r36_release_rights tests_standalone.test_r36_visual_candidates -v
      - name: Legacy Creator R15 export contracts
        run: python -m unittest tests_standalone.test_drawtemp5_r15 -v
      - name: R36.C2 complete screenshot matrix (no Qt required)
        run: python scripts/r36_visual_candidates.py matrix
      - name: R32 platform collision regression
        run: python -m unittest tests_standalone.test_platform_physics_r32 -v
      - name: Legacy R28 and R12 animation regressions
        run: python -m unittest tests_standalone.test_r28d_animation_events_roundtrip tests_standalone.test_drawtemp5_r12_animation -v
      - name: R26 Action Player regressions
        run: python -m unittest tests_standalone.test_action_player_r26b -v

  r36-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        run: python -m pip install -e ".[qt6]"
      - name: Qt offscreen widget authoring (not a GPU certification)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests_standalone.test_r36_animation_graph_qt -v
      - name: R36.B2 visual marker editor undo and tick preview
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests_standalone.test_r36_animation_timeline_qt -v
      - name: R36.B1 action viewport QML overlay smoke (software only)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_r36_committed_fx_qt -v
      - name: R36.C1 canonical authored PNG actor -> Qt viewport and CPU profile
        # Exercises the R36.B3 Qt smoke with verified real PNGs and profiler JSON.
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_r36_action_actor_qt -v
      - name: R36.C2 capture candidate Qt Studio and Action Player goldens
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python scripts/r36_visual_candidates.py capture --output r36-visual-candidates
      - name: Upload R36 candidate screenshots for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-qt-candidate-goldens
          path: r36-visual-candidates/
          if-no-files-found: ignore
          retention-days: 14
