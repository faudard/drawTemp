name: R36 Animation and Committed FX

on:
  pull_request:
    paths:
      - 'sporebound/animation_graph.py'
      - 'drawtemp/render/committed_fx.py'
      - 'sporebound/animation_timeline.py'
      - 'drawtemp/studio/animation_timeline_authoring.py'
      - 'drawtemp/studio/animation_timeline_qt.py'
      - 'drawtemp/render/vfx2d.py'
      - 'tests_standalone/test_r36_animation_timeline.py'
      - 'tests_standalone/test_r36_animation_timeline_qt.py'
      - 'tests_standalone/test_r36_vfx2d.py'
      - 'drawtemp/player/action_controller.py'
      - 'drawtemp/player/ActionPreview.qml'
      - 'tests_standalone/test_r36_committed_fx.py'
      - 'tests_standalone/test_r36_committed_fx_qt.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/studio/animation_graph_authoring.py'
      - 'drawtemp/studio/animation_graph_qt.py'
      - 'drawtemp/studio/r28d_workflow_qt.py'
      - 'tests_standalone/test_r36_animation_graph.py'
      - 'tests_standalone/test_r36_animation_graph_qt.py'
      - '.github/workflows/r36-animation-controller.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/animation_graph.py'
      - 'drawtemp/render/committed_fx.py'
      - 'sporebound/animation_timeline.py'
      - 'drawtemp/studio/animation_timeline_authoring.py'
      - 'drawtemp/studio/animation_timeline_qt.py'
      - 'drawtemp/render/vfx2d.py'
      - 'tests_standalone/test_r36_animation_timeline.py'
      - 'tests_standalone/test_r36_animation_timeline_qt.py'
      - 'tests_standalone/test_r36_vfx2d.py'
      - 'drawtemp/player/action_controller.py'
      - 'drawtemp/player/ActionPreview.qml'
      - 'tests_standalone/test_r36_committed_fx.py'
      - 'tests_standalone/test_r36_committed_fx_qt.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/studio/animation_graph_authoring.py'
      - 'drawtemp/studio/animation_graph_qt.py'
      - 'drawtemp/studio/r28d_workflow_qt.py'
      - 'tests_standalone/test_r36_animation_graph.py'
      - 'tests_standalone/test_r36_animation_graph_qt.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r36-headless:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile touched modules
        run: python -m compileall -q sporebound/animation_graph.py drawtemp/studio/animation_graph_authoring.py drawtemp/studio/animation_graph_qt.py drawtemp/studio/r28d_workflow_qt.py drawtemp/render/committed_fx.py drawtemp/player/action_controller.py sporebound/animation_timeline.py drawtemp/studio/animation_timeline_authoring.py drawtemp/studio/animation_timeline_qt.py drawtemp/render/vfx2d.py
      - name: Animation graph deterministic and canonical persistence
        run: python -m unittest tests_standalone.test_r36_animation_graph -v
      - name: R36.B1 committed impact timing, recovery, budgets and replay
        run: python -m unittest tests_standalone.test_r36_committed_fx -v
      - name: R36.B2 timeline cues and CPU light/particle bounds
        run: python -m unittest tests_standalone.test_r36_animation_timeline tests_standalone.test_r36_vfx2d -v
      - name: Legacy R28 and R12 animation regressions
        run: python -m unittest tests_standalone.test_r28d_animation_events_roundtrip tests_standalone.test_drawtemp5_r12_animation -v
      - name: R26 Action Player regressions
        run: python -m unittest tests_standalone.test_action_player_r26b -v

  r36-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        run: python -m pip install -e ".[qt6]"
      - name: Qt offscreen widget authoring (not a GPU certification)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests_standalone.test_r36_animation_graph_qt -v
      - name: R36.B2 visual marker editor undo and tick preview
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests_standalone.test_r36_animation_timeline_qt -v
      - name: R36.B1 action viewport QML overlay smoke (software only)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_r36_committed_fx_qt -v
