name: R62 Farming Life

on:
  pull_request:
    paths:
      - 'sporebound/farming_life.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'drawtemp/sdk/simulation.py'
      - 'tests_standalone/test_r62_farming_life.py'
      - 'docs/R62_A_FARMING_LIFE.md'
      - '.github/workflows/r62-farming-life.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r62-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R62 calendar, farm replay, inventory and SDK
        run: python -m unittest tests_standalone.test_r62_farming_life -v
      - name: R35 living-world and R55 system compatibility
        run: >-
          python -m unittest
          tests_standalone.test_r35_commerce
          tests_standalone.test_r55_system_design
          tests_standalone.test_r25_scene_router -v
