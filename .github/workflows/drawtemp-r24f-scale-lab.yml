name: DrawTemp R24.F CPU scale and massive sim

on:
  pull_request:
    paths:
      - 'drawtemp/sdk/r24f_mass_lab.py'
      - 'drawtemp/sdk/__init__.py'
      - 'drawtemp/render/tile_chunks.py'
      - 'drawtemp/quality/r24f_scale.py'
      - 'drawtemp/quality/r24f_cli.py'
      - 'tests_standalone/test_drawtemp5_r24f.py'
      - '.github/workflows/drawtemp-r24f-scale-lab.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/sdk/r24f_mass_lab.py'
      - 'drawtemp/sdk/__init__.py'
      - 'drawtemp/render/tile_chunks.py'
      - 'drawtemp/quality/r24f_scale.py'
      - 'drawtemp/quality/r24f_cli.py'
      - 'tests_standalone/test_drawtemp5_r24f.py'
      - '.github/workflows/drawtemp-r24f-scale-lab.yml'

jobs:
  headless-scale-and-seeds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: R24.F and native R13 / R3 regressions
        run: python -m unittest tests_standalone.test_drawtemp5_r24f tests_standalone.test_drawtemp5_r13 tests_standalone.test_drawtemp5_r3b
      - name: Produce R24.F host CPU-only evidence
        run: python -m drawtemp.quality.r24f_cli --mode both --seeds 2 --command-limit 8 --samples 2 --report r24f-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r24f-cpu-${{ matrix.os }}-${{ matrix.python }}
          path: r24f-report.json
          if-no-files-found: warn
