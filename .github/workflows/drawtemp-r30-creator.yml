name: DrawTemp R30 Creator contracts (preview)
on:
  pull_request:
    paths:
      - 'drawtemp/sdk/capability_contracts.py'
      - 'drawtemp/sdk/semantic_review.py'
      - 'drawtemp/export/creator_packs.py'
      - 'drawtemp/export/creator_pack_cli.py'
      - 'tests_standalone/test_drawtemp_r30_creator.py'
      - 'docs/drawtemp5/R30_A_CREATOR_CONTRACTS.md'
      - '.github/workflows/drawtemp-r30-creator.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: R30 headless / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: SDK, inert packs, merge and R1 authoring regression
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r30_creator
          tests_standalone.test_drawtemp5_r1_authoring
          -v
      - name: R1 deterministic tactical reference (no Qt/GPU claim)
        run: >-
          python -m drawtemp.sdk.migration
          --verify-baseline docs/drawtemp5/reference-baseline.json
