name: DrawTemp R19.A art gates

on:
  pull_request:
    paths:
      - "drawtemp/assets/art_gate.py"
      - "drawtemp/assets/characters.py"
      - "tests_standalone/test_drawtemp5_r19a.py"
      - ".github/workflows/drawtemp-r19a.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/assets/art_gate.py"
      - "drawtemp/assets/characters.py"
      - "tests_standalone/test_drawtemp5_r19a.py"
      - ".github/workflows/drawtemp-r19a.yml"

jobs:
  art-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[art]"
      - run: python -m unittest tests_standalone.test_drawtemp5_r19a -v
