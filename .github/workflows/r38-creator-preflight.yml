name: DrawTemp R38.4 Creator Preflight

on:
  pull_request:
    paths:
      - 'drawtemp/sdk/r38_preflight.py'
      - 'drawtemp/studio/r38_preflight_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r38_preflight.py'
      - 'docs/R38_4_CREATOR_PREFLIGHT.md'
      - '.github/workflows/r38-creator-preflight.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-headless:
    name: R38.4 headless / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests_standalone.test_drawtemp_r38_preflight.PreflightTests -v
      - run: python -m unittest tests_standalone.test_drawtemp_r38_refactor.RefactorTests -v
      - run: python -m unittest tests_standalone.test_drawtemp_r38_prefabs.PrefabVariantTests -v
      - run: python -m unittest tests_standalone.test_r17_asset_rights -v

  preflight-qt:
    name: R38.4 Qt offscreen / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - run: python -m unittest tests_standalone.test_drawtemp_r38_preflight.PreflightQtTests -v
