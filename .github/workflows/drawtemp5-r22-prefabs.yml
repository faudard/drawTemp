name: DrawTemp R22.2B Prefab Shelf
on:
  pull_request:
    paths:
      - 'drawtemp/studio/map_prefabs.py'
      - 'drawtemp/studio/map_authoring.py'
      - 'drawtemp/studio/map_editor.py'
      - 'tests_standalone/test_drawtemp5_r22_prefabs*.py'
      - '.github/workflows/drawtemp5-r22-prefabs.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/map_prefabs.py'
      - 'drawtemp/studio/map_authoring.py'
      - 'drawtemp/studio/map_editor.py'
      - 'tests_standalone/test_drawtemp5_r22_prefabs*.py'
      - '.github/workflows/drawtemp5-r22-prefabs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefabs:
    name: R22.2B + R22.2A/R5 regressions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - run: python -m pip install -e ".[qt6]"
      - name: R22.2B prefabs / R22.2A biome / R5 selection and map
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest -v
          tests_standalone.test_drawtemp5_r22_prefabs
          tests_standalone.test_drawtemp5_r22_prefabs_qt
          tests_standalone.test_drawtemp5_r22_terrain
          tests_standalone.test_drawtemp5_r22_terrain_qt
          tests_standalone.test_drawtemp5_r5_map
          tests_standalone.test_drawtemp5_r5_selection
          tests_standalone.test_drawtemp5_r5_selection_qt
          tests_standalone.test_drawtemp5_r5_layers
