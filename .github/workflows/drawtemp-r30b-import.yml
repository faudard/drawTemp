name: DrawTemp R30.B Canonical Pack Import
on:
  pull_request:
    paths:
      - 'drawtemp/export/pack_import.py'
      - 'drawtemp/export/pack_import_cli.py'
      - 'drawtemp/export/creator_packs.py'
      - 'drawtemp/sdk/capability_contracts.py'
      - 'tests_standalone/test_drawtemp_r30_creator.py'
      - 'tests_standalone/test_drawtemp_r30b_pack_import.py'
      - 'docs/drawtemp5/R30_B_PACK_IMPORT.md'
      - '.github/workflows/drawtemp-r30b-import.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-contract:
    name: R30.B import / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verify canonical pack imports and R1 authoring
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r30_creator
          tests_standalone.test_drawtemp_r30b_pack_import
          tests_standalone.test_drawtemp5_r1_authoring
          -v
      - name: Check unchanged Jeanne tactical baseline
        run: >-
          python -m drawtemp.sdk.migration
          --verify-baseline docs/drawtemp5/reference-baseline.json
