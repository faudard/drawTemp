name: DrawTemp 5 R4 Asset Pipeline
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Test R4 canonical assets, persistence, atlas and headless guards
        run: python -m unittest tests_standalone.test_drawtemp5_r4_assets tests_standalone.test_drawtemp5_r4_runtime tests_standalone.test_assets -v
      - name: Core remains independent of GUI
        run: python scripts/audit_drawtemp5.py --check --strict
  qt-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install '.[qt6]'
      - name: Real Qt Widgets R4 asset browser smoke (software only)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_drawtemp5_r4_qt tests_standalone.test_drawtemp5_r4_runtime_qt -v
