name: DrawTemp R24.B Studio plugins

on:
  pull_request:
    paths:
      - 'drawtemp/studio/plugins.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp5_r24b.py'
      - 'examples/plugins/**'
      - '.github/workflows/drawtemp-r24b-plugins.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/plugins.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp5_r24b.py'
      - 'examples/plugins/**'
      - '.github/workflows/drawtemp-r24b-plugins.yml'

jobs:
  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest tests_standalone.test_drawtemp5_r24b tests_standalone.test_drawtemp5_r24a tests_standalone.test_drawtemp5_r15_creator

  qt-offscreen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'PySide6==6.8.3'
      - run: python -m unittest tests_standalone.test_drawtemp5_r24b.QtPluginDockTests
