name: DrawTemp R47.A Declarative Modding (headless)

on:
  pull_request:
    paths:
      - 'drawtemp/sdk/modding.py'
      - 'drawtemp/sdk/__init__.py'
      - 'drawtemp/sdk/capability_contracts.py'
      - 'drawtemp/export/creator_packs.py'
      - 'tests_standalone/test_drawtemp_r47a_modding.py'
      - 'examples/mods/**'
      - 'docs/drawtemp5/R47A_DECLARATIVE_MODDING.md'
      - '.github/workflows/drawtemp-r47a-modding.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: R47.A contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: R47.A modding + R24.B Studio plugin + R30 pack regressions
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r47a_modding
          tests_standalone.test_drawtemp5_r24b.ManifestContractTests
          tests_standalone.test_drawtemp_r30_creator.CreatorPackTests
          -v
