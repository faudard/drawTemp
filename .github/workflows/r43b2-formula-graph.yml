name: R43.B2 Formula Graph and Balance Lab

on:
  pull_request:
    paths:
      - 'drawtemp/sdk/ability_contracts.py'
      - 'drawtemp/studio/ability_formula_graph_r43.py'
      - 'drawtemp/studio/ability_formula_graph_r43_qt.py'
      - 'drawtemp/studio/ability_designer_r43_qt.py'
      - 'tests_standalone/test_drawtemp_r43b2_formula_graph.py'
      - 'tests_standalone/test_drawtemp_r43b2_formula_qt.py'
      - 'tests_standalone/test_drawtemp_r43b_ability_qt.py'
      - '.github/workflows/r43b2-formula-graph.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/ability_formula_graph_r43.py'
      - 'drawtemp/studio/ability_formula_graph_r43_qt.py'
      - 'drawtemp/studio/ability_designer_r43_qt.py'
      - 'tests_standalone/test_drawtemp_r43b2_formula_graph.py'
      - 'tests_standalone/test_drawtemp_r43b2_formula_qt.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula-contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests_standalone.test_drawtemp_r43_ability_contracts tests_standalone.test_drawtemp_r43b_ability_draft tests_standalone.test_drawtemp_r43b2_formula_graph -v

  formula-qt-offscreen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[qt6]'
      - run: python -m unittest tests_standalone.test_drawtemp_r43b_ability_qt tests_standalone.test_drawtemp_r43b2_formula_qt -v
