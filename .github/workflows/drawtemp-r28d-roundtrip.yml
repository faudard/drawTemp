name: DrawTemp R28.D animation events roundtrip

on:
  pull_request:
    paths:
      - 'drawtemp/studio/r28d_workflow.py'
      - 'drawtemp/studio/r28d_workflow_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r28d_animation_events_roundtrip.py'
      - '.github/workflows/drawtemp-r28d-roundtrip.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/r28d_workflow.py'
      - 'drawtemp/studio/r28d_workflow_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r28d_animation_events_roundtrip.py'
      - '.github/workflows/drawtemp-r28d-roundtrip.yml'

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: R28.D animation + R9 graph + GameSession replay
        run: python -m unittest tests_standalone.test_r28d_animation_events_roundtrip -v
      - name: R28.C and R25 headless regressions
        run: >-
          python -m unittest
          tests_standalone.test_r28c_gameplay_designers
          tests_standalone.test_r25_foundation
          -v

  qt-roundtrip:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - run: python -m pip install -e ".[qt6]"
      - name: R28.D Qt, R28.C Qt and R2 shell regression
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_r28d_animation_events_roundtrip
          tests_standalone.test_r28c_gameplay_designers
          tests_standalone.test_drawtemp5_r2
          -v
      - name: Smoke Studio Events / Animation page
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace events
