name: R59.A live maintenance contract (NO-GO)
on:
  pull_request:
    paths:
      - 'drawtemp/export/live_maintenance.py'
      - 'tests_standalone/test_r59a_live_maintenance.py'
      - '.github/workflows/r59a-live-maintenance.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/export/live_maintenance.py'
      - 'tests_standalone/test_r59a_live_maintenance.py'
      - '.github/workflows/r59a-live-maintenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-and-descriptor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install creator library
        run: python -m pip install .
      - name: R59.A version/provenance, safe snapshot and clean restore
        run: python -m unittest tests_standalone.test_r59a_live_maintenance -v
      - name: R39 release-plan regressions
        run: python -m unittest tests_standalone.test_r39_publishing -v
