name: DrawTemp 5 R7C Jeanne Artwork and Equipment
on:
  pull_request:
    paths:
      - 'drawtemp/assets/jeanne_art.py'
      - 'drawtemp/assets/character_outfits.py'
      - 'drawtemp/studio/character_studio.py'
      - 'drawtemp/render/qt_viewport.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/controller.py'
      - 'drawtemp/sdk/simulation.py'
      - 'sporebound/game_session.py'
      - 'drawtemp/player/Main.qml'
      - 'tests_standalone/test_drawtemp5_r7_jeanne_art.py'
      - 'tests_standalone/test_drawtemp5_r7_equipment_gameplay.py'
      - 'tests_standalone/test_drawtemp5_r7_qt.py'
      - 'scripts/render_jeanne_art_contact_sheet.py'
      - '.github/workflows/drawtemp5-r7c-art.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  art-and-save-headless:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[art]"
      - run: python -m unittest tests_standalone.test_drawtemp5_r7_jeanne_art tests_standalone.test_drawtemp5_r7_equipment_gameplay -v
      - name: Generate actual Player pack from canonical Jeanne atlas
        run: python -m drawtemp.assets.jeanne_art --repository . --output .r7-jeanne-authoring

  player-studio-qt6:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux OpenGL software dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6,art]"
      - name: Build four-editable-outfit Jeanne pack
        run: python -m drawtemp.assets.jeanne_art --output .r7-jeanne-authoring
      - name: Art consistency and Qt QML runtime tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_drawtemp5_r7_jeanne_art tests_standalone.test_drawtemp5_r7_qt -v
      - name: Real Studio and Player with generated outfit atlas
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.map_editor --smoke --character-pack .r7-jeanne-authoring/runtime
      - name: Real Player with generated outfits
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.player.qt_app --smoke --reference --smoke-scene battle --character-pack .r7-jeanne-authoring/runtime
      - name: Build human-review contact sheet
        if: runner.os == 'Linux'
        run: python scripts/render_jeanne_art_contact_sheet.py .r7-jeanne-authoring --output jeanne_r7c_review.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: jeanne-r7c-art-review
          path: |
            jeanne_r7c_review.png
            .r7-jeanne-authoring/jeanne.character.json
            .r7-jeanne-authoring/runtime/character.json
            .r7-jeanne-authoring/runtime/atlas.png
          include-hidden-files: true
