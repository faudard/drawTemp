name: DrawTemp 5.0 R2 Studio Shell

on:
  pull_request:
    paths:
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/workspace_model.py'
      - 'drawtemp/studio/inspector_model.py'
      - 'drawtemp/studio/resource_links.py'
      - 'tests_standalone/test_drawtemp5_r2.py'
      - 'tests_standalone/test_drawtemp5_r2_cd.py'
      - 'docs/drawtemp5/R2_QT_STUDIO.md'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp5-r2.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/workspace_model.py'
      - 'tests_standalone/test_drawtemp5_r2.py'
      - 'pyproject.toml'

jobs:
  studio-r2:
    name: R2 / Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install project with Qt 6
        run: python -m pip install -e ".[qt6]"
      - name: Headless SDK and R2 regression
        run: |
          python -m unittest tests_standalone.test_drawtemp5_r1_authoring tests_standalone.test_drawtemp5_r2 tests_standalone.test_drawtemp5_r2_cd -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Shell CLI offscreen smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace project
      - name: Map editor integration smoke (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace maps
