name: DrawTemp R27.C Player Puzzle Bridge
on:
  pull_request:
    paths:
      - 'drawtemp/player/puzzle_context.py'
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/tactical_feedback.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'drawtemp/render/iso_scene.py'
      - 'drawtemp/render/IsoViewport.qml'
      - 'tests_standalone/test_drawtemp5_r27c_*.py'
      - 'docs/drawtemp5/R27C_PLAYER_PUZZLES.md'
      - '.github/workflows/drawtemp-r27c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R27.C verified autosave, puzzle Player commands and legacy parity
        run: python -m unittest tests_standalone.test_drawtemp5_r27c_player -v
      - name: R27.A/B canonical engine and editor contracts
        run: python -m unittest tests_standalone.test_drawtemp5_r27_dungeon tests_standalone.test_drawtemp5_r27_puzzles -v
      - name: R12 canonical lifecycle and R3 shared viewport
        run: python -m unittest tests_standalone.test_drawtemp5_r12 tests_standalone.test_drawtemp5_shared_viewport.SharedRendererContractTests -v

  player-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Software Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: R27.C actual Qt Quick Player, R3 scene and puzzle bridge
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          DRAWTEMP_R27C_QT_SMOKE: '1'
        run: python -m unittest tests_standalone.test_drawtemp5_r27c_qt -v
      - name: Existing standalone Player Qt binding smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.player.qt_app --reference --smoke --smoke-scene battle
