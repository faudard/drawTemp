name: R25 Fixed Realtime Movement
on:
  pull_request:
    paths:
      - 'sporebound/fixed_realtime.py'
      - 'sporebound/game_session.py'
      - 'sporebound/fixed_clock.py'
      - 'sporebound/scene_router.py'
      - 'tests_standalone/test_r25_fixed_realtime.py'
      - '.github/workflows/r25-fixed-realtime.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/fixed_realtime.py'
      - 'sporebound/game_session.py'
      - 'sporebound/fixed_clock.py'
      - 'sporebound/scene_router.py'
      - 'tests_standalone/test_r25_fixed_realtime.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  movement-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R25.C integer motion, collision, save and replay
        run: python -m unittest tests_standalone.test_r25_fixed_realtime -v
      - name: R25.A deterministic journal + profile migration
        run: python -m unittest tests_standalone.test_r25_foundation -v
      - name: R25.B scene transition and campaign replay
        run: python -m unittest tests_standalone.test_r25_scene_router -v
      - name: Unmodified Jeanne tactical GameSession
        run: python -m unittest tests_standalone.test_game_session -v
