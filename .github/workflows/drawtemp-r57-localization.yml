name: DrawTemp R57 Localization and Accessibility Foundation

on:
  pull_request:
    paths:
      - 'drawtemp/localization/**'
      - 'drawtemp/studio/r57_translation_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'tests_standalone/test_drawtemp5_r57.py'
      - '.github/workflows/drawtemp-r57-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless SDK
        run: python -m pip install -e .
      - name: R57 headless tests
        run: python -m unittest tests_standalone.test_drawtemp5_r57.R57CatalogTests -v

  localization-qt:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt graphical dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install Studio and Player
        run: python -m pip install ".[qt6]"
      - name: R57 Qt dialog and regression
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_drawtemp5_r57 tests_standalone.test_drawtemp5_r18d -v
