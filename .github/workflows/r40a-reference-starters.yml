name: R40.A creator reference starters

on:
  push:
    paths:
      - "drawtemp/sdk/r40_starters.py"
      - "sporebound/platform_physics.py"
      - "sporebound/game_session.py"
      - "drawtemp/player/platform_app.py"
      - "tests_standalone/test_r40_platform_ability.py"
      - "tests_standalone/test_r40_platform_boss.py"
      - "sporebound/platform_boss.py"
      - "drawtemp/export/templates.py"
      - "drawtemp/quality/r40_headless.py"
      - "tests_standalone/test_r40_reference_starters.py"
      - "tests_standalone/test_r40_headless.py"
      - "tests_standalone/test_r40_player_routes.py"
      - "tests_standalone/test_r40_player_platform.py"
      - "drawtemp/render/PlatformViewport.qml"
      - "drawtemp/sdk/simulation.py"
      - "drawtemp/player/controller.py"
      - "drawtemp/player/qt_app.py"
      - "drawtemp/player/Main.qml"
      - ".github/workflows/r40a-reference-starters.yml"
  pull_request:
    paths:
      - "drawtemp/sdk/r40_starters.py"
      - "sporebound/platform_physics.py"
      - "sporebound/game_session.py"
      - "drawtemp/player/platform_app.py"
      - "tests_standalone/test_r40_platform_ability.py"
      - "tests_standalone/test_r40_platform_boss.py"
      - "sporebound/platform_boss.py"
      - "drawtemp/export/templates.py"
      - "drawtemp/quality/r40_headless.py"
      - "tests_standalone/test_r40_reference_starters.py"
      - "tests_standalone/test_r40_headless.py"
      - "tests_standalone/test_r40_player_routes.py"
      - "tests_standalone/test_r40_player_platform.py"
      - "drawtemp/render/PlatformViewport.qml"
      - "drawtemp/sdk/simulation.py"
      - "drawtemp/player/controller.py"
      - "drawtemp/player/qt_app.py"
      - "drawtemp/player/Main.qml"
      - ".github/workflows/r40a-reference-starters.yml"

jobs:
  source-contracts:
    name: Source-only contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical packages
        run: python -m pip install -e .
      - name: Verify four starters and wizard
        run: |
          python -m unittest tests_standalone.test_r40_reference_starters -v
          python -m unittest tests_standalone.test_r40_headless -v
          python -m unittest tests_standalone.test_r40_player_routes -v
          python -m unittest tests_standalone.test_r40_player_platform -v
          python -m unittest tests_standalone.test_r40_platform_ability -v
          python -m unittest tests_standalone.test_r40_platform_boss -v
          python -m unittest tests_standalone.test_platform_physics_r32 tests_standalone.test_platform_journey_r32 -v
          python -m drawtemp.quality.r40_headless --report r40-source-audit.json
          python -m unittest tests_standalone.test_drawtemp5_r22_project_wizard -v

  qt-offscreen-smoke:
    name: Qt software smoke (not UX/GPU certification)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Qt Quick software dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install Studio dependencies
        run: python -m pip install -e ".[qt6]"
      - name: Verify Qt creator catalog
        run: |
          python -m unittest tests_standalone.test_r40_reference_starters -v
          python -m unittest tests_standalone.test_r40_player_routes -v
          python -m unittest tests_standalone.test_r40_player_platform -v
          python -m drawtemp.player.platform_app --r40-metroidvania --smoke
