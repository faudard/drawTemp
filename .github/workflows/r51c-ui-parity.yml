name: R51.C UI Parity, Rights and Packaging

on:
  pull_request:
    paths:
      - 'sporebound/ui_layout_r51.py'
      - 'drawtemp/quality/r51_ui.py'
      - 'drawtemp/export/r15.py'
      - 'drawtemp/player/R51*.qml'
      - 'drawtemp/player/Main.qml'
      - 'drawtemp/studio/r51_designer_qt.py'
      - 'scripts/r51c_verify_wheel.py'
      - 'tests_standalone/test_r51c_*.py'
      - '.github/workflows/r51c-ui-parity.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/quality/r51_ui.py'
      - 'drawtemp/export/r15.py'
      - 'drawtemp/player/R51*.qml'
      - 'drawtemp/player/Main.qml'
      - 'drawtemp/studio/r51_designer_qt.py'
      - 'scripts/r51c_verify_wheel.py'
      - 'tests_standalone/test_r51c_*.py'

permissions:
  contents: read

jobs:
  typed-ui-export-regressions:
    name: R51 headless / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: R51.A/B/B2/C and R15/R17 rights regressions
        run: python -m unittest -v tests_standalone.test_r51a_ui_layout tests_standalone.test_r51b_layout_designer tests_standalone.test_r51b2_ui_navigation tests_standalone.test_r51c_export tests_standalone.test_r51c_theme_contract tests_standalone.test_r51c_wheel tests_standalone.test_drawtemp5_r15 tests_standalone.test_r17_asset_rights

  shared-qt-software-capture:
    name: Qt Quick parity (offscreen software only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      DRAWTEMP_R51_QT_GATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: Studio controls and shared-QML screenshot parity
        run: python -m unittest -v tests_standalone.test_r51b_qt tests_standalone.test_r51c_qt_parity

  wheel-ui-assets:
    name: Wheel UI packaging / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - name: Verify actual wheel includes both Qt Quick authoring resources
        shell: python
        run: |
          from pathlib import Path
          from scripts.r51c_verify_wheel import verify_wheel
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one built wheel, got {wheels}"
          evidence = verify_wheel(wheels[0])
          print(evidence)
          assert evidence["resources_present"]
          assert evidence["native_export_certified"] is False
