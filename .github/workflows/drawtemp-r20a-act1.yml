name: "R20.A Jeanne Act I production contract"

on:
  pull_request:
    paths:
      - "sporebound/content/jeanne.json"
      - "sporebound/content/jeanne.game.json"
      - "sporebound/narrative.py"
      - "sporebound/game_session.py"
      - "scripts/audit_r20_act1.py"
      - "tests_standalone/test_r20_act1_contract.py"
      - "docs/jeanne/**"
      - ".github/workflows/drawtemp-r20a-act1.yml"
  workflow_dispatch:

jobs:
  r20a-headless:
    name: "R20.A / ${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install headless package
        run: python -m pip install -e .
      - name: Audit canonical narrative pack
        run: python scripts/audit_r20_act1.py
      - name: Verify contracts and existing tactical path
        run: python -m unittest tests_standalone.test_r20_act1_contract tests_standalone.test_jeanne_acte1 tests_standalone.test_jeanne_prologue -v
