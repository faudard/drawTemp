name: DrawTemp R49.B3 Playtest Lifecycle

on:
  pull_request:
    paths:
      - 'drawtemp/studio/r49_playtest.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r49_playtest_lifecycle.py'
      - 'docs/drawtemp5/R49B3_STUDIO_PLAYER_RETURN.md'
      - '.github/workflows/r49-playtest-lifecycle.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/r49_playtest.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r49_playtest_lifecycle.py'
      - 'docs/drawtemp5/R49B3_STUDIO_PLAYER_RETURN.md'
      - '.github/workflows/r49-playtest-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest-lifecycle:
    name: R49.B3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install Studio + Player
        run: python -m pip install -e ".[qt6]"
      - name: R49.B3 real child process and Studio regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest -v
          tests_standalone.test_r49_playtest_lifecycle
          tests_standalone.test_r49_inspector_integrity
          tests_standalone.test_drawtemp5_r18b
          tests_standalone.test_r49_workspace_focus
          tests_standalone.test_r49_creator_ux
          tests_standalone.test_r49_experience
      - name: Compile Python files
        run: >-
          python -m compileall -q
          drawtemp/studio/r49_playtest.py
          drawtemp/studio/qt_shell.py
          tests_standalone/test_r49_playtest_lifecycle.py
      - name: Qt Studio offscreen initialization
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke
