name: DrawTemp 5 R0 Foundation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/audit_drawtemp5.py --check --report r0-imports.json
      - run: python -m unittest tests_standalone.test_drawtemp5_r0 tests_standalone.test_game_session tests_standalone.test_jeanne_prologue tests_standalone.test_jeanne_chapter1_mvp tests_standalone.test_event_graph tests_standalone.test_map_transform tests_standalone.test_iso_map_builder tests_standalone.test_iso_structures_3712 -v
      - run: python -m drawtemp.sdk.migration --report r0-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0-headless-${{ matrix.python }}
          path: r0-*.json
  qt6-composition:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[qt6]"
      - name: Installed Widgets and Quick composition probe (software, not GPU certification)
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.platform.qt_bootstrap --smoke
