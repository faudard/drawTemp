name: DrawTemp R47.B Qt Mod Inspector (offscreen)

on:
  pull_request:
    paths:
      - 'drawtemp/sdk/modding.py'
      - 'drawtemp/studio/r47_mods_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r47b_qt.py'
      - 'docs/drawtemp5/R47B_QT_MOD_INSPECTOR.md'
      - '.github/workflows/drawtemp-r47b-qt.yml'
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qt-inspector:
    name: R47.B Qt offscreen / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[qt6]"
      - name: R47.B Qt lifecycle and R47.A headless regression
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r47b_qt
          tests_standalone.test_drawtemp_r47a_modding
          -v
