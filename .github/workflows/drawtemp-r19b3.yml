name: DrawTemp R19.B3 directional bestiary

on:
  pull_request:
    paths:
      - "drawtemp/assets/bestiary_r19.py"
      - "drawtemp/render/qt_viewport.py"
      - "drawtemp/player/qt_app.py"
      - "tests_standalone/test_drawtemp5_r19b3_bestiary.py"
      - "tests_standalone/test_drawtemp5_r19b3_qt.py"
      - "docs/drawtemp5/R19_B3_DIRECTIONAL_BESTIARY.md"
      - ".github/workflows/drawtemp-r19b3.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/assets/bestiary_r19.py"
      - "drawtemp/render/qt_viewport.py"
      - "drawtemp/player/qt_app.py"
      - "tests_standalone/test_drawtemp5_r19b3_bestiary.py"
      - "tests_standalone/test_drawtemp5_r19b3_qt.py"
      - ".github/workflows/drawtemp-r19b3.yml"

jobs:
  bestiary-pixels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[art]"
      - run: python -m unittest tests_standalone.test_drawtemp5_r19b3_bestiary tests_standalone.test_drawtemp5_r19b2_visual_clips -v

  qt-multi-actor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[art,qt6]"
      - run: python -m unittest tests_standalone.test_drawtemp5_r19b3_qt tests_standalone.test_drawtemp5_r19b2_qt tests_standalone.test_drawtemp5_r7_qt -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
