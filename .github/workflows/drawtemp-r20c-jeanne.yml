name: R20.C Jeanne Cinematics and Branch Persistence

on:
  pull_request:
    paths:
      - "sporebound/content/jeanne.r20c.game.json"
      - "sporebound/cinematics.py"
      - "sporebound/narrative.py"
      - "sporebound/game_session.py"
      - "scripts/preview_r20c_jeanne.py"
      - "tests_standalone/test_r20c_jeanne_cinematics.py"
      - ".github/workflows/drawtemp-r20c-jeanne.yml"
  workflow_dispatch:

jobs:
  r20c-headless:
    name: R20.C ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install headless
        run: python -m pip install -e .
      - name: Validate authored cinematic clips without Qt
        run: python scripts/preview_r20c_jeanne.py --list
      - name: Run campaign regression and real tactical branches
        run: python -m unittest tests_standalone.test_r20c_jeanne_cinematics tests_standalone.test_r20b_jeanne_playable tests_standalone.test_jeanne_acte1 tests_standalone.test_jeanne_prologue -v
