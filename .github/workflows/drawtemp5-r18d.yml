name: DrawTemp R18.D Onboarding and Accessibility

on:
  pull_request:
    paths:
      - 'drawtemp/studio/r18_onboarding.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp5_r18d.py'
      - 'docs/drawtemp5/R18D_ONBOARDING_ACCESSIBILITY.md'
      - '.github/workflows/drawtemp5-r18d.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/r18_onboarding.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp5_r18d.py'
      - '.github/workflows/drawtemp5-r18d.yml'

jobs:
  onboarding-r18d:
    name: R18.D / Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install DrawTemp Qt
        run: python -m pip install -e ".[qt6]"
      - name: R18 onboarding and regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m unittest tests_standalone.test_drawtemp5_r18d tests_standalone.test_drawtemp5_r18a tests_standalone.test_drawtemp5_r18b tests_standalone.test_drawtemp5_r18c -v
      - name: Smoke accessible Studio home and Player title
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m drawtemp.studio.qt_shell --smoke --workspace project
          python -m drawtemp.player.qt_app --reference --smoke --smoke-scene title
