name: R65.C Action Arena
on:
  pull_request:
    paths:
      - "sporebound/action_arena_r65.py"
      - "drawtemp/player/r65_arena_controller.py"
      - "drawtemp/player/r65_arena_app.py"
      - "drawtemp/player/R65Arena.qml"
      - "tests_standalone/test_r65c_action_arena.py"
      - "tests_standalone/test_r65c_arena_qt.py"
      - "docs/drawtemp5/R65_C_ACTION_ARENA.md"
      - ".github/workflows/r65c-action-arena.yml"
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  headless-r65c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R65.C arena and fixed clock
        run: python -m unittest -v tests_standalone.test_r65c_action_arena tests_standalone.test_r65c_arena_qt
      - name: R65.A/B and legacy action/CT
        run: python -m unittest -v tests_standalone.test_action_combat_r65 tests_standalone.test_r65b_combat_composer tests_standalone.test_action_runtime_r26 tests_standalone.test_game_session
  qt-r65c-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . PySide6
      - name: Offscreen real shared renderer and QML smoke
        run: python -m unittest -v tests_standalone.test_r65c_arena_qt
