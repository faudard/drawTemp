name: R62 Farm Studio

on:
  pull_request:
    paths:
      - 'drawtemp/studio/farming_authoring.py'
      - 'drawtemp/studio/farming_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r62_farming_authoring.py'
      - 'tests_standalone/test_r62_farming_gui.py'
      - 'docs/R62_B1_FARM_STUDIO.md'
      - '.github/workflows/r62-farming-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r62-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R62 typed CRUD, R35 opt-in, revision conflicts, R1 history
        run: >-
          python -m unittest tests_standalone.test_r62_farming_authoring
          tests_standalone.test_r62_farming_life -v
  r62-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: R62 native Farm Studio and global Undo/Redo
        run: python -m unittest tests_standalone.test_r62_farming_gui -v
