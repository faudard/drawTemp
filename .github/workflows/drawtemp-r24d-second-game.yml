name: DrawTemp R24.D independent second game

on:
  pull_request:
    paths:
      - 'drawtemp/creator_examples/**'
      - 'drawtemp/quality/r24_platform.py'
      - 'drawtemp/export/templates.py'
      - 'scripts/certify_r24_second_game.py'
      - 'tests_standalone/test_drawtemp5_r24d.py'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp-r24d-second-game.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/creator_examples/**'
      - 'drawtemp/quality/r24_platform.py'
      - 'drawtemp/export/templates.py'
      - 'scripts/certify_r24_second_game.py'
      - 'tests_standalone/test_drawtemp5_r24d.py'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp-r24d-second-game.yml'

jobs:
  independent-game:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel-compatible package
        run: python -m pip install -e .
      - name: Headless gate and regression
        run: python -m unittest tests_standalone.test_drawtemp5_r24d.SecondGameGateTests tests_standalone.test_drawtemp5_r15_creator tests_standalone.test_drawtemp5_r24a
      - name: Emit software-only witness
        run: python -m scripts.certify_r24_second_game --report r24d-software-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r24d-${{ matrix.os }}-${{ matrix.python }}
          path: r24d-software-report.json
          if-no-files-found: warn

  qt-studio-offscreen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'PySide6==6.8.3'
      - run: python -m unittest tests_standalone.test_drawtemp5_r24d.QtSecondGameTests
