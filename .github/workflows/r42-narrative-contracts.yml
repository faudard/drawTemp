name: R42.A Narrative contracts

on:
  pull_request:
    paths:
      - "sporebound/narrative.py"
      - "sporebound/narrative_r42.py"
      - "sporebound/narrative_state_r42.py"
      - "sporebound/narrative_playback_r42.py"
      - "sporebound/game_session.py"
      - "drawtemp/sdk/simulation.py"
      - "drawtemp/player/controller.py"
      - "drawtemp/player/qt_app.py"
      - "drawtemp/player/Main.qml"
      - "drawtemp/studio/narrative_workbench_r42.py"
      - "drawtemp/studio/narrative_qt_r42.py"
      - "drawtemp/studio/qt_shell.py"
      - "tests_standalone/test_r42_narrative_contracts.py"
      - "tests_standalone/test_r42_narrative_state.py"
      - "tests_standalone/test_r42_narrative_workbench.py"
      - "tests_standalone/test_r42_narrative_qt.py"
      - "tests_standalone/test_r42_narrative_player.py"
      - ".github/workflows/r42-narrative-contracts.yml"
  push:
    branches: [master]
    paths:
      - "sporebound/narrative.py"
      - "sporebound/narrative_r42.py"
      - "sporebound/narrative_state_r42.py"
      - "sporebound/narrative_playback_r42.py"
      - "sporebound/game_session.py"
      - "drawtemp/sdk/simulation.py"
      - "drawtemp/player/controller.py"
      - "drawtemp/player/qt_app.py"
      - "drawtemp/player/Main.qml"
      - "drawtemp/studio/narrative_workbench_r42.py"
      - "drawtemp/studio/narrative_qt_r42.py"
      - "drawtemp/studio/qt_shell.py"
      - "tests_standalone/test_r42_narrative_contracts.py"
      - "tests_standalone/test_r42_narrative_state.py"
      - "tests_standalone/test_r42_narrative_workbench.py"
      - "tests_standalone/test_r42_narrative_qt.py"
      - "tests_standalone/test_r42_narrative_player.py"

jobs:
  narrative-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: R42.A plus R9 and story regression
        run: python -m unittest tests_standalone.test_r42_narrative_contracts tests_standalone.test_r42_narrative_state tests_standalone.test_r42_narrative_workbench tests_standalone.test_r42_narrative_player tests_standalone.test_narrative tests_standalone.test_story_graph tests_standalone.test_game_session -v
      - name: R42.B Qt Studio/Player offscreen
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m pip install 'PySide6==6.8.3'
          python -m unittest tests_standalone.test_r42_narrative_qt -v
