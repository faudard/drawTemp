name: DrawTemp 5 R3 Shared Renderer
on:
  pull_request:
    paths:
      - 'drawtemp/render/**'
      - 'scripts/benchmark_drawtemp5_r3.py'
      - 'tests_standalone/test_drawtemp5_r3.py'
      - 'tests_standalone/test_drawtemp5_r3b.py'
      - 'tests_standalone/test_drawtemp5_shared_viewport.py'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp5-r3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projection:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest tests_standalone.test_drawtemp5_r3 tests_standalone.test_drawtemp5_r3b.ChunkAndLayerTests tests_standalone.test_drawtemp5_r1 tests_standalone.test_drawtemp5_shared_viewport.SharedRendererContractTests -v
      - run: python scripts/audit_drawtemp5.py --check --strict
      - name: R3 CPU projection measurements (not GPU certification)
        run: python scripts/benchmark_drawtemp5_r3.py --frames 30 --output r3-cpu-projection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-cpu-${{ matrix.python }}
          path: r3-cpu-projection.json
  qt-quick-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: Same R3 Qt Quick scene loaded from Studio and Player
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m drawtemp.render.qt_viewport --mode studio --smoke
          python -m drawtemp.render.qt_viewport --mode player --smoke
      - name: R5 Widgets and R12 Player use the exact R3 Qt viewport
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_drawtemp5_shared_viewport.SharedRendererQtSmoke tests_standalone.test_drawtemp5_r3b.QtRendererR3BSmoke -v
