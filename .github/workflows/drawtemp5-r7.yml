name: DrawTemp 5 R7 Character Studio
on:
  pull_request:
    paths:
      - 'drawtemp/assets/characters.py'
      - 'drawtemp/studio/character_studio.py'
      - 'tests_standalone/test_drawtemp5_r7.py'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp5-r7.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  character-headless:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[art]"
      - run: python -m unittest tests_standalone.test_drawtemp5_r7 -v
      - run: python -m drawtemp.assets.characters --root . --template jeanne

  character-qt6-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux OpenGL loader for offscreen Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6,art]"
      - name: Open Character Studio without starting the event loop indefinitely
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.character_studio --smoke
