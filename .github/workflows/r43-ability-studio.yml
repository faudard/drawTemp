name: R43.B Ability Designer Studio Qt

on:
  pull_request:
    paths:
      - 'drawtemp/sdk/ability_contracts.py'
      - 'drawtemp/studio/ability_authoring_r43.py'
      - 'drawtemp/studio/ability_designer_r43_qt.py'
      - 'drawtemp/studio/genre_rules_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r43b_ability_draft.py'
      - 'tests_standalone/test_drawtemp_r43b_ability_qt.py'
      - '.github/workflows/r43-ability-studio.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/ability_authoring_r43.py'
      - 'drawtemp/studio/ability_designer_r43_qt.py'
      - 'drawtemp/studio/genre_rules_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r43b_ability_draft.py'
      - 'tests_standalone/test_drawtemp_r43b_ability_qt.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r43b-headless:
    name: R43.B1 contracts and drafts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: R43.A strict authoring foundation
        run: python -m unittest tests_standalone.test_drawtemp_r43_ability_contracts -v
      - name: R43.B1 effect ordering, target projection and stale revisions
        run: python -m unittest tests_standalone.test_drawtemp_r43b_ability_draft -v
      - name: Native authoring and deterministic tactical regressions
        run: python -m unittest tests_standalone.test_drawtemp5_r1_authoring tests_standalone.test_combat31 -v

  r43b-qt:
    name: R43.B1 Qt offscreen / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[qt6]'
      - name: Qt live forms / target cells / stale apply / shell integration
        run: python -m unittest tests_standalone.test_drawtemp_r43b_ability_qt -v
