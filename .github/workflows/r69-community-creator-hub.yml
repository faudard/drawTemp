name: R69 Community Creator Hub

on:
  pull_request:
    paths:
      - "drawtemp/sdk/community_hub.py"
      - "drawtemp/export/community_hub_cli.py"
      - "drawtemp/export/creator_packs.py"
      - "drawtemp/export/pack_import.py"
      - "tests_standalone/test_drawtemp_r69_community_hub.py"
      - "pyproject.toml"
      - ".github/workflows/r69-community-creator-hub.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/sdk/community_hub.py"
      - "drawtemp/export/community_hub_cli.py"
      - "drawtemp/export/creator_packs.py"
      - "drawtemp/export/pack_import.py"
      - "tests_standalone/test_drawtemp_r69_community_hub.py"
      - ".github/workflows/r69-community-creator-hub.yml"

permissions:
  contents: read

jobs:
  offline-community-hub:
    name: "R69 offline hub / ${{ matrix.os }} / Python 3.12"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository
        run: python -m pip install -e .
      - name: R69 three-pack exchange and safety
        run: python -m unittest -v tests_standalone.test_drawtemp_r69_community_hub
      - name: Existing R30 and R47 compatibility
        run: python -m unittest -v tests_standalone.test_drawtemp_r30b_pack_import tests_standalone.test_drawtemp_r47a_modding
