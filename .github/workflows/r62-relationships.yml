name: R62 Relationships

on:
  pull_request:
    paths:
      - 'sporebound/relationship_life.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'drawtemp/sdk/simulation.py'
      - 'drawtemp/studio/relationship_authoring.py'
      - 'drawtemp/studio/relationship_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r62_relationship_*.py'
      - 'docs/R62_B2_RELATIONSHIPS.md'
      - '.github/workflows/r62-relationships.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  social-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Social replay, canonical SDK and authoring history
        run: >-
          python -m unittest
          tests_standalone.test_r62_relationship_life
          tests_standalone.test_r62_relationship_authoring
          tests_standalone.test_r62_farming_life
          tests_standalone.test_r35_living_world -v
  social-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: Relationship Studio native Qt and R1 Undo/Redo
        run: python -m unittest tests_standalone.test_r62_relationship_gui -v
