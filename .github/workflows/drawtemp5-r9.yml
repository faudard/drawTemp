name: DrawTemp 5 R9 Event and Narrative
on:
  pull_request:
    paths:
      - 'drawtemp/studio/**'
      - 'drawtemp/sdk/**'
      - 'sporebound/event_*.py'
      - 'sporebound/story_authoring.py'
      - 'tests_standalone/test_drawtemp5_r9*.py'
      - 'sporebound/branch_qa_363.py'
      - 'sporebound/event_pages.py'
      - 'sporebound/model.py'
      - 'sporebound/rules/triggers.py'
      - 'sporebound/game_session.py'
      - 'sporebound/engine.py'
      - 'sporebound/tactical_rpg3.py'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp5-r9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Canonical event authoring, graph and headless SDK regression
        run: python -m unittest tests_standalone.test_drawtemp5_r9 tests_standalone.test_drawtemp5_r9b tests_standalone.test_drawtemp5_r9c tests_standalone.test_drawtemp5_r9d tests_standalone.test_drawtemp5_r1_authoring tests_standalone.test_event_graph tests_standalone.test_event_debugger_33 tests_standalone.test_event_branch_builder_35 tests_standalone.test_branch_qa_363 -v

  qt6:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: R9 headless contracts and offscreen Qt workspace
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_drawtemp5_r9 tests_standalone.test_drawtemp5_r9b tests_standalone.test_drawtemp5_r9c tests_standalone.test_drawtemp5_r9d -v
