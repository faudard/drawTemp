name: DrawTemp 5 R15 native export (preview)
on:
  pull_request:
    paths:
      - 'drawtemp/export/**'
      - 'drawtemp/player/**'
      - 'drawtemp/studio/**'
      - 'scripts/r15_*'
      - '.github/workflows/drawtemp5-r15.yml'
      - 'pyproject.toml'
      - 'sporebound/**'
      - 'tests_standalone/test_drawtemp5_r15.py'
      - 'tests_standalone/test_drawtemp5_r23a.py'
      - 'tests_standalone/test_drawtemp5_r23_evidence.py'
      - 'scripts/r23_release_gate.py'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-contract:
    name: R15 preflight and integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests_standalone.test_drawtemp5_r15 tests_standalone.test_drawtemp5_r15_creator tests_standalone.test_drawtemp5_r23a tests_standalone.test_drawtemp5_r23_evidence -v
      - run: python -m drawtemp.export.cli check --content sporebound/content/jeanne.json

  native-bundle:
    name: R15 native Player + Studio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]" "pyinstaller==6.15.0"
      - name: Freeze independent Qt Quick Player
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir
          --name DrawTempPlayer
          --collect-data drawtemp --collect-data sporebound
          scripts/r15_player_entry.py
      - name: Export and verify Jeanne with full runtime
        run: >-
          python -m drawtemp.export.cli export
          --content sporebound/content/jeanne.json
          --runtime-dir dist/DrawTempPlayer
          --output export/Jeanne
      - run: python -m drawtemp.export.cli verify --bundle export/Jeanne
      - name: R23.A record actual native bundle integrity for this commit
        run: >-
          python scripts/r23_release_gate.py native
          --bundle export/Jeanne
          --platform ${{ runner.os }}
          --revision ${{ github.sha }}
          --report r23-native.json
      - name: Store per-OS native integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: r23-native-${{ runner.os }}
          path: r23-native.json
          if-no-files-found: error
      - name: Smoke frozen Player outside the source tree
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cd export/Jeanne && ./Player/DrawTempPlayer.exe --smoke && ./Player/DrawTempPlayer.exe --smoke --smoke-scene exploration
          else
            cd export/Jeanne && ./Player/DrawTempPlayer --smoke && ./Player/DrawTempPlayer --smoke --smoke-scene exploration
          fi
      - name: Archive native game bundle with executable permissions
        shell: bash
        run: tar -czf "r15-bundle-${{ runner.os }}.tar.gz" -C export Jeanne
      - name: Publish native game for separate clean-runner verification
        uses: actions/upload-artifact@v4
        with:
          name: r15-bundle-${{ runner.os }}
          path: r15-bundle-${{ runner.os }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Freeze Qt Map Studio
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir
          --name DrawTempStudio
          --collect-data drawtemp --collect-data sporebound
          scripts/r15_studio_entry.py
      - name: Save preview artifacts (not a certified release)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-preview-${{ runner.os }}
          path: |
            export/Jeanne/**
            dist/DrawTempStudio/**
          if-no-files-found: warn

  r23-cross-os-ledger:
    name: R23.A commit-pinned release ledger (NO-GO)
    needs: native-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          pattern: r23-native-*
          path: r23-evidence
          merge-multiple: false
      - name: Require the three platforms and identical Git SHA
        run: >-
          python scripts/r23_release_gate.py aggregate
          --directory r23-evidence
          --revision ${{ github.sha }}
          --report r23-release-ledger.json
      - name: Retain incomplete-release decision and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r23-release-ledger
          path: r23-release-ledger.json
          if-no-files-found: warn

  relocated-player:
    name: R17.8 exported Player / ${{ matrix.os }} / isolated runner
    needs: native-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Deliberately NO checkout, setup-python, pip, or Studio in this job.
      # libEGL/libOpenGL are documented OS runtime prerequisites, not Python.
      - name: Linux Qt system runtime (no Python/Studio install)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Download only the released game archive
        uses: actions/download-artifact@v4
        with:
          name: r15-bundle-${{ runner.os }}
          path: ${{ runner.temp }}/r17-game-download
      - name: Verify relocated native launch and tamper rejection
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          PYTHONPATH: ''
          PYTHONHOME: ''
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          runtime_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Git Bash tar interprets D:/... as a remote archive; use POSIX path.
            runtime_temp="$(cygpath -u "$RUNNER_TEMP")"
          fi
          dest="$runtime_temp/r17-fresh-player"
          mkdir -p "$dest"
          tar -xzf "$runtime_temp/r17-game-download/r15-bundle-${{ runner.os }}.tar.gz" -C "$dest"
          cd "$dest/Jeanne"
          test -f manifest.json
          test -f game/jeanne.json
          test -f game/jeanne.game.json
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            player="./Player/DrawTempPlayer.exe"
          else
            player="./Player/DrawTempPlayer"
            test -x "$player"
          fi
          # These two launches come from the extracted bundle in a distinct
          # runner with no repository checkout, installed wheel, or Studio.
          "$player" --smoke
          "$player" --smoke --smoke-scene exploration
          printf '\nTamper rejection (mandatory):\n'
          printf '\nR17-NEGATIVE-TAMPER\n' >> game/jeanne.json
          if "$player" --smoke > "$runtime_temp/r17-tamper.log" 2>&1; then
            echo "FAIL: native Player accepted modified game assets"
            exit 1
          fi
          if ! grep -qi "integrity failure" "$runtime_temp/r17-tamper.log"; then
            echo "FAIL: expected integrity failure, got:"
            cat "$runtime_temp/r17-tamper.log"
            exit 1
          fi
          echo "R17.8 isolated-runner smoke + fail-closed tamper gate passed"
