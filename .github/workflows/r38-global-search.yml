name: DrawTemp R38.1 Creator Global Search

on:
  pull_request:
    paths:
      - 'drawtemp/studio/r38_global_search.py'
      - 'drawtemp/studio/r38_search_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r38_search.py'
      - 'docs/R38_1_GLOBAL_SEARCH.md'
      - '.github/workflows/r38-global-search.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-search:
    name: R38.1 headless / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests_standalone.test_drawtemp_r38_search.GlobalSearchHeadlessTests -v
      - run: python -m unittest tests_standalone.test_drawtemp5_r2_cd.ReferenceGraphTests -v

  studio-qt:
    name: R38.1 Qt offscreen / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - run: python -m unittest tests_standalone.test_drawtemp_r38_search.GlobalSearchQtTests -v
