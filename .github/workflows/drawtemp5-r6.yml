name: DrawTemp 5 R6 Construction
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R6 canonical building authoring and R1 transactional regression
        run: python -m unittest tests_standalone.test_drawtemp5_r6 tests_standalone.test_drawtemp5_r6_geometry tests_standalone.test_drawtemp5_r6_10 tests_standalone.test_vertical_combat_3720c2 tests_standalone.test_drawtemp5_r1_authoring tests_standalone.test_iso_structures_3712 tests_standalone.test_interior_levels_3720b -v
  qt-dock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt loader dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install '.[qt6]'
      - name: Qt Widgets dock / headless project
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests_standalone.test_drawtemp5_r6_qt tests_standalone.test_drawtemp5_r6_geometry_qt tests_standalone.test_drawtemp5_r6_10_qt tests_standalone.test_drawtemp5_r6_geometry tests_standalone.test_drawtemp5_r6 -v
