name: R62 Farm Village Player

on:
  pull_request:
    paths:
      - 'drawtemp/player/r62_village.py'
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'tests_standalone/test_r62_village_player.py'
      - 'tests_standalone/test_r62_village_player_gui.py'
      - 'docs/R62_C_FARM_VILLAGE_PLAYER.md'
      - '.github/workflows/r62-village-player.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r62-player-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Full R62 village Player and canonical regressions
        run: >-
          python -m unittest
          tests_standalone.test_r62_village_player
          tests_standalone.test_r62_farming_life
          tests_standalone.test_r62_relationship_life
          tests_standalone.test_r62_relationship_authoring -v

  r62-player-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: Real R62 QML PlayerBridge and slot smoke
        run: python -m unittest tests_standalone.test_r62_village_player_gui -v
