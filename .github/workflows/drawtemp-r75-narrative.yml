name: DrawTemp R75.A Reviewed Narrative

on:
  pull_request:
    paths:
      - "drawtemp/studio/r75_narrative_assist.py"
      - "tests_standalone/test_drawtemp_r75_narrative.py"
      - "docs/R75_ASSISTED_NARRATIVE.md"
      - ".github/workflows/drawtemp-r75-narrative.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/studio/r75_narrative_assist.py"
      - "tests_standalone/test_drawtemp_r75_narrative.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: R75 offline story, consent, paths and save / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: R75.A review and canonical replay regression
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r75_narrative
          tests_standalone.test_drawtemp5_r9
