name: Distribution smoke
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Test an installed wheel outside the repository
        run: python scripts/verify_distribution.py dist
      - name: Store distributable Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drawtemp-python-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
