name: R53 Party Orchestration and Qt Composer

on:
  pull_request:
    paths:
      - 'sporebound/party_orchestration.py'
      - 'sporebound/classic_party.py'
      - 'sporebound/game_session.py'
      - 'sporebound/classic_encounter.py'
      - 'drawtemp/player/controller.py'
      - 'tests_standalone/test_r53_combo_rpg.py'
      - 'tests_standalone/test_r53_party_orchestration.py'
      - 'drawtemp/studio/party_orchestration_authoring.py'
      - 'drawtemp/studio/party_orchestration_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r53_party_composer.py'
      - 'tests_standalone/test_r53_party_composer_qt.py'
      - 'tests_standalone/test_r53_player_combo.py'
      - 'drawtemp/creator_examples/r53_hybrid.py'
      - 'drawtemp/export/templates.py'
      - 'drawtemp/sdk/simulation.py'
      - 'drawtemp/player/qt_app.py'
      - 'tests_standalone/test_r53_hybrid_slice.py'
      - 'drawtemp/player/Main.qml'
      - '.github/workflows/r53-party-orchestration.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/party_orchestration.py'
      - 'sporebound/classic_party.py'
      - 'sporebound/game_session.py'
      - 'sporebound/classic_encounter.py'
      - 'drawtemp/player/controller.py'
      - 'tests_standalone/test_r53_combo_rpg.py'
      - 'tests_standalone/test_r53_party_orchestration.py'
      - 'drawtemp/studio/party_orchestration_authoring.py'
      - 'drawtemp/studio/party_orchestration_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r53_party_composer.py'
      - 'tests_standalone/test_r53_party_composer_qt.py'
      - 'tests_standalone/test_r53_player_combo.py'
      - 'drawtemp/creator_examples/r53_hybrid.py'
      - 'drawtemp/export/templates.py'
      - 'drawtemp/sdk/simulation.py'
      - 'drawtemp/player/qt_app.py'
      - 'tests_standalone/test_r53_hybrid_slice.py'
      - 'drawtemp/player/Main.qml'
permissions:
  contents: read
jobs:
  party-r53:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m pip install 'PySide6>=6.6,<7'
      - run: python -m compileall -q sporebound/party_orchestration.py sporebound/classic_party.py sporebound/game_session.py drawtemp/studio/party_orchestration_authoring.py drawtemp/studio/party_orchestration_qt.py
      - run: python -m unittest -v tests_standalone.test_r53_party_orchestration tests_standalone.test_r53_combo_rpg tests_standalone.test_r53_party_composer tests_standalone.test_r53_party_composer_qt tests_standalone.test_r53_player_combo tests_standalone.test_r53_hybrid_slice
      - run: python -m unittest -v tests_standalone.test_r41_classic_party tests_standalone.test_r41_party_studio tests_standalone.test_r41_party_qt tests_standalone.test_r41_encounter tests_standalone.test_r41_routed_encounter tests_standalone.test_game_session tests_standalone.test_r25_foundation
