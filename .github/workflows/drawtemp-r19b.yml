name: DrawTemp R19.B Jeanne motion candidates

on:
  pull_request:
    paths:
      - "drawtemp/assets/jeanne_motion_r19.py"
      - "tests_standalone/test_drawtemp5_r19b.py"
      - "docs/drawtemp5/R19_B1_JEANNE_MOTION_CANDIDATE.md"
      - ".github/workflows/drawtemp-r19b.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/assets/jeanne_motion_r19.py"
      - "tests_standalone/test_drawtemp5_r19b.py"
      - ".github/workflows/drawtemp-r19b.yml"

jobs:
  motion-candidates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[art]"
      - run: python -m unittest tests_standalone.test_drawtemp5_r19a tests_standalone.test_drawtemp5_r19b tests_standalone.test_drawtemp5_r7_jeanne_art -v
