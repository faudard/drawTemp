name: DrawTemp R18.A Studio UX

on:
  pull_request:
    paths:
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/r18_navigation.py'
      - 'tests_standalone/test_drawtemp5_r18a.py'
      - '.github/workflows/drawtemp5-r18a.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/r18_navigation.py'
      - 'tests_standalone/test_drawtemp5_r18a.py'
      - '.github/workflows/drawtemp5-r18a.yml'

jobs:
  studio-r18a:
    name: R18.A / Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install with Qt 6
        run: python -m pip install -e ".[qt6]"
      - name: R18 navigation plus R2 regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_drawtemp5_r18a tests_standalone.test_drawtemp5_r2 -v
      - name: Publication shell smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace publication
