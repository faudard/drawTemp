name: Studio Qt ADS docking smoke

on:
  pull_request:
    paths:
      - 'drawtemp/studio/ads_docking.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/map_editor.py'
      - 'tests_standalone/test_studio_qtads.py'
      - 'pyproject.toml'
      - '.github/workflows/studio-qtads.yml'
  workflow_dispatch:

jobs:
  docking:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt 6 and Qt ADS
        run: python -m pip install -e ".[qt6-docking]"
      - name: Test native fallback and ADS state
        run: python -m unittest tests_standalone.test_studio_qtads -v
      - name: Smoke Studio UI
        run: python -m drawtemp.studio.qt_shell --smoke
      - name: Smoke Map Editor
        run: python -m drawtemp.studio.map_editor --smoke
