name: Studio fast paths 3.7.32C
on:
  pull_request:
    paths:
      - 'sporebound/studio_index4.py'
      - 'sporebound/studio_workspace.py'
      - 'sporebound/studio_event_graph.py'
      - 'scripts/benchmark_studio_fastpaths_3732c.py'
      - 'tests_standalone/test_workspace_cache_3732c.py'
      - 'tests_standalone/test_retained_event_graph_3732c_gui.py'
      - '.github/workflows/performance-fastpaths-3732c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-process-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb python3-pil
      - name: Validate cache, invalidation and references
        run: python3 -m unittest tests_standalone.test_workspace_cache_3732c -v
      - name: Check retained Canvas against full draw and legacy event editing
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: >-
          xvfb-run -a python3 -m unittest -v
          tests_standalone.test_retained_event_graph_3732c_gui
          tests_standalone.test_event_graph_gui
      - name: Produce paired Workspace/Tk measurements
        run: >-
          xvfb-run -a python3 scripts/benchmark_studio_fastpaths_3732c.py
          --quick --output fastpaths-3732c-smoke.json
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-fastpaths-smoke
          path: fastpaths-3732c-smoke.json
          if-no-files-found: warn
