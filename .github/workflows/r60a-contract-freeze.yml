name: R60.A Contract Freeze (supporting evidence)
on:
  pull_request:
    paths:
      - "drawtemp/quality/r60_freeze.py"
      - "drawtemp/sdk/**"
      - "sporebound/**"
      - "docs/drawtemp5/reference-baseline.json"
      - "tests_standalone/test_r60_contract_freeze.py"
      - ".github/workflows/r60a-contract-freeze.yml"
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Strict historical compatibility unit tests
        run: python -m unittest tests_standalone.test_r60_contract_freeze -v
      - name: R0 historical Jeanne CT, save/replay baseline
        run: python -m drawtemp.sdk.migration --verify-baseline docs/drawtemp5/reference-baseline.json --report r60-r0-parity.json
      - name: R60.A explicit NO-GO evidence (not a 10.0 certificate)
        run: python -m drawtemp.quality.r60_freeze --root . --revision ${{ github.sha }} --output r60a-report.json --enforce-regressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r60a-headless-${{ matrix.python }}
          path: |
            r60-r0-parity.json
            r60a-report.json
