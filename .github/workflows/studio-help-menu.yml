name: Studio Help and Tutorial Selector
on:
  pull_request:
    paths:
      - 'drawtemp/studio/help_dialogs.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_studio_help_menu.py'
      - '.github/workflows/studio-help-menu.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/help_dialogs.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_studio_help_menu.py'
      - '.github/workflows/studio-help-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-help-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt prerequisites
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install Studio and Qt
        run: python -m pip install -e ".[qt6]"
      - name: Check Help menu and tutorial selector
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest -v tests_standalone.test_studio_help_menu
