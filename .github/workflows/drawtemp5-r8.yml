name: DrawTemp 5.0 R8 database

on:
  pull_request:
    paths:
      - 'drawtemp/studio/rpg_database*.py'
      - 'drawtemp/studio/r8_*.py'
      - 'tests_standalone/test_drawtemp5_r8*.py'
      - 'docs/drawtemp5/R8_RPG_DATABASE.md'
      - 'docs/drawtemp5/R8_B_TALENTS_ENCOUNTERS.md'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp5-r8.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/rpg_database*.py'
      - 'drawtemp/studio/r8_*.py'
      - 'tests_standalone/test_drawtemp5_r8*.py'
      - 'pyproject.toml'

jobs:
  rpg-database:
    name: R8 / Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt platform libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install project and Qt
        run: python -m pip install -e ".[qt6]"
      - name: Targeted headless regression
        run: python -m unittest discover -s tests_standalone -p "test_drawtemp5_r8_database.py" -v
      - name: R8.B talent and encounter regression
        run: python -m unittest discover -s tests_standalone -p "test_drawtemp5_r8b.py" -v
      - name: R8.C referential integrity and variable regressions
        run: python -m unittest discover -s tests_standalone -p "test_drawtemp5_r8c.py" -v
      - name: Qt Widgets offscreen regression (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests_standalone -p "test_drawtemp5_r8_qt.py" -v
          python -m unittest discover -s tests_standalone -p "test_drawtemp5_r8b_qt.py" -v
          python -m unittest discover -s tests_standalone -p "test_drawtemp5_r8c_qt.py" -v
          python -m drawtemp.studio.rpg_database_qt --smoke
