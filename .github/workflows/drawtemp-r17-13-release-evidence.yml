name: DrawTemp R17.13 Release Evidence (blocked preview)
on:
  pull_request:
    paths:
      - 'drawtemp/quality/r17_release_evidence.py'
      - 'scripts/r17_collect_checks.py'
      - 'tests_standalone/test_r17_13_*.py'
      - 'docs/drawtemp5/R17_13_RELEASE_EVIDENCE.md'
      - '.github/workflows/drawtemp-r17-13-release-evidence.yml'
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  dossier:
    name: R17.13 evidence inventory / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Unit tests and release-contract regressions
        shell: bash
        run: |
          mkdir -p artifacts/r17-13
          set -o pipefail
          python -m unittest -v \
            tests_standalone.test_r17_13_release_evidence \
            tests_standalone.test_r17_13_check_capture \
            tests_standalone.test_drawtemp5_r15 \
            2>&1 | tee artifacts/r17-13/tests.log
      - name: Capture paginated CI checks for exact SHA
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/r17_collect_checks.py
          --repo "${{ github.repository }}"
          --revision "${{ github.sha }}"
          --output artifacts/r17-13/github-checks.json
      - name: Write indexed evidence and blocked draft release notes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --revision "${{ github.sha }}"
            --artifact "test-log=artifacts/r17-13/tests.log"
            --artifact "roadmap=docs/DRAWTEMP_5_0_TO_6_0_DETAILED_ROADMAP.md"
            --artifact "r17-review=docs/drawtemp5/R17_CONSOLIDATED_REVIEW.md"
            --artifact "release-policy=docs/drawtemp5/R17_13_RELEASE_EVIDENCE.md"
            --report artifacts/r17-13/release-evidence.json
            --notes artifacts/r17-13/RELEASE_NOTES_DRAFT.md
          )
          if [[ -f artifacts/r17-13/github-checks.json ]]; then
            args+=(--checks-json artifacts/r17-13/github-checks.json)
          fi
          python -m drawtemp.quality.r17_release_evidence "${args[@]}"
      - name: Preserve evidence, never publish a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r17-13-dossier-py${{ matrix.python }}
          path: artifacts/r17-13/**
          if-no-files-found: error
          retention-days: 14
