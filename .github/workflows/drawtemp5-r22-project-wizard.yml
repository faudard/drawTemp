name: DrawTemp 5 R22.1 Project Wizard
on:
  pull_request:
    paths:
      - 'drawtemp/export/templates.py'
      - 'drawtemp/studio/project_wizard.py'
      - 'drawtemp/studio/r15_creator.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp5_r22_project_wizard.py'
      - '.github/workflows/drawtemp5-r22-project-wizard.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/export/templates.py'
      - 'drawtemp/studio/project_wizard.py'
      - 'drawtemp/studio/r15_creator.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp5_r22_project_wizard.py'
      - '.github/workflows/drawtemp5-r22-project-wizard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-wizard:
    name: R22.1 canonical creation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - run: python -m pip install -e ".[qt6]"
      - name: R22.1 wizard + R15 template and R2 shell regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest -v
          tests_standalone.test_drawtemp5_r22_project_wizard
          tests_standalone.test_drawtemp5_r15_creator
          tests_standalone.test_drawtemp5_r2
      - name: Studio launch smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace project
