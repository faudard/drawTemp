name: DrawTemp R58 package ecosystem

on:
  pull_request:
    paths:
      - 'drawtemp/assets/package_ecosystem.py'
      - 'drawtemp/assets/packs.py'
      - 'tests_standalone/test_drawtemp_r58a_package_ecosystem.py'
      - 'tests_standalone/test_drawtemp5_r24c.py'
      - 'drawtemp/studio/package_manager.py'
      - 'drawtemp/studio/package_manager_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r58b_package_manager.py'
      - 'tests_standalone/test_drawtemp_r58b_qt.py'
      - 'drawtemp/studio/package_upgrades.py'
      - 'drawtemp/studio/package_upgrade_recovery.py'
      - 'tests_standalone/test_drawtemp_r58b3_dependencies.py'
      - 'tests_standalone/test_drawtemp_r58b3_recovery.py'
      - 'tests_standalone/test_drawtemp_r58b_upgrades.py'
      - '.github/workflows/r58a-package-ecosystem.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/assets/package_ecosystem.py'
      - 'drawtemp/assets/packs.py'
      - 'tests_standalone/test_drawtemp_r58a_package_ecosystem.py'
      - 'tests_standalone/test_drawtemp5_r24c.py'
      - 'drawtemp/studio/package_manager.py'
      - 'drawtemp/studio/package_manager_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r58b_package_manager.py'
      - 'tests_standalone/test_drawtemp_r58b_qt.py'
      - 'drawtemp/studio/package_upgrades.py'
      - 'drawtemp/studio/package_upgrade_recovery.py'
      - 'tests_standalone/test_drawtemp_r58b3_dependencies.py'
      - 'tests_standalone/test_drawtemp_r58b3_recovery.py'
      - 'tests_standalone/test_drawtemp_r58b_upgrades.py'
      - '.github/workflows/r58a-package-ecosystem.yml'

jobs:
  r58-package-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable SDK
        run: python -m pip install -e .
      - name: R58.A and R58.B1 headless lifecycle regression tests
        run: python -m unittest tests_standalone.test_drawtemp_r58a_package_ecosystem tests_standalone.test_drawtemp_r58b_package_manager tests_standalone.test_drawtemp_r58b_upgrades tests_standalone.test_drawtemp_r58b3_dependencies tests_standalone.test_drawtemp_r58b3_recovery tests_standalone.test_drawtemp5_r24c

  r58-package-qt-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt dependencies
        run: python -m pip install -e ".[qt6]"
      - name: Qt package UI smoke (not onscreen certification)
        run: python -m unittest tests_standalone.test_drawtemp_r58b_qt
