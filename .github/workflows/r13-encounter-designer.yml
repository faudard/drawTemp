name: DrawTemp R13.6 Encounter Designer

on:
  pull_request:
    paths:
      - "drawtemp/sdk/r13_encounter_authoring.py"
      - "drawtemp/studio/r13_workbench.py"
      - "tests_standalone/test_drawtemp5_r13_encounter_designer.py"
      - "tests_standalone/test_drawtemp5_r13_qt.py"
      - ".github/workflows/r13-encounter-designer.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/sdk/r13_encounter_authoring.py"
      - "drawtemp/studio/r13_workbench.py"
      - "tests_standalone/test_drawtemp5_r13_encounter_designer.py"

permissions:
  contents: read

jobs:
  authoring-and-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R13.6 objective authoring, real replay and R1 undo/redo
        run: python -m unittest tests_standalone.test_drawtemp5_r13_encounter_designer -v
      - name: R13 previous invariants
        run: python -m unittest tests_standalone.test_drawtemp5_r13 -v

  qt-encounter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[qt6]"
      - name: R13 Qt interactive encounter window smoke
        run: python -m unittest tests_standalone.test_drawtemp5_r13_qt -v
