name: DrawTemp R30.F CPU Performance and Asset Budgets
on:
  pull_request:
    paths:
      - 'drawtemp/quality/r30_scale.py'
      - 'drawtemp/studio/r30_scale_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r30f_scale.py'
      - 'tests_standalone/test_drawtemp_r30f_qt.py'
      - 'docs/drawtemp5/R30_F_PERFORMANCE_SCALE.md'
      - '.github/workflows/drawtemp-r30f-scale.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: R30.F canonical and synthetic CPU scale / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Run measured CPU and asset contracts
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r30f_scale
          tests_standalone.test_drawtemp5_r14
          tests_standalone.test_drawtemp5_r1_authoring
          tests_standalone.test_drawtemp_r30e_gallery
          -v
      - name: Generate real informational report (NO fixed cloud thresholds)
        run: >-
          python -m drawtemp.quality.r30_scale
          --samples 3 --warmups 0 --synthetic-resources 1000
          --output r30f-measured.json
      - name: Verify baseline Jeanne tactical replay (non GPU)
        run: >-
          python -m drawtemp.sdk.migration
          --verify-baseline docs/drawtemp5/reference-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r30f-cpu-${{ matrix.os }}
          path: r30f-measured.json
          if-no-files-found: ignore
          retention-days: 14

  qt-offscreen:
    name: R30.F Qt visualization / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: Offscreen report chart and non-mutating Studio action
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r30f_qt
          tests_standalone.test_drawtemp_r30e_qt
          -v
      - name: Verify Qt Studio initialization
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke
