name: DrawTemp R29C Runtime Replay Contract

on:
  pull_request:
    paths:
      - 'drawtemp/quality/r29c_integrated.py'
      - 'scripts/certify_r29c_journeys.py'
      - 'tests_standalone/test_r29c_integrated.py'
      - 'docs/drawtemp5/R29C_RUNTIME_REPLAY.md'
      - '.github/workflows/drawtemp-r29c-integrated.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-contract:
    name: R29C regression contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DrawTemp headless package
        run: python -m pip install .
      - name: Test evidence rules, command allowlist and conditional real integrations
        run: python -m unittest tests_standalone.test_r29c_integrated -v
      - name: Always record missing dependencies as BLOCKED and release as NO-GO
        run: python scripts/certify_r29c_journeys.py --report r29c/report.json --revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29c-${{ matrix.os }}
          path: r29c/report.json
          if-no-files-found: warn
