name: Runtime and event add-ons

on:
  push:
    paths:
      - "drawtemp/sdk/event_addons.py"
      - "drawtemp/sdk/__init__.py"
      - "drawtemp/studio/events.py"
      - "drawtemp/studio/addon_manager_qt.py"
      - "drawtemp/studio/qt_shell.py"
      - "drawtemp/player/qt_app.py"
      - "examples/addons/**"
      - "tests_standalone/test_event_addons.py"
      - ".github/workflows/event-addon-runtime.yml"
  pull_request:
    paths:
      - "drawtemp/sdk/event_addons.py"
      - "drawtemp/sdk/__init__.py"
      - "drawtemp/studio/events.py"
      - "drawtemp/studio/addon_manager_qt.py"
      - "drawtemp/studio/qt_shell.py"
      - "drawtemp/player/qt_app.py"
      - "examples/addons/**"
      - "tests_standalone/test_event_addons.py"
      - ".github/workflows/event-addon-runtime.yml"

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Event add-ons and legacy controlled scripts
        run: python -m unittest tests_standalone.test_event_addons.ContractTests tests_standalone.test_event_addons.CompilationTests tests_standalone.test_drawtemp5_r24e.ManifestTests tests_standalone.test_drawtemp5_r24e.CompiledHookTests -v

  qt-studio-player:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt Studio dependencies
        run: python -m pip install -e ".[qt6]"
      - name: Native StoryBook Player smoke
        run: python -m unittest tests_standalone.test_event_addons.QtStudioPlayerTests -v
