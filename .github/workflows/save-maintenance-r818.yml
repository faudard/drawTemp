name: Save integrity and retention R8.18

on:
  pull_request:
    paths:
      - 'sporebound/save_maintenance.py'
      - 'examples/save_maintenance.py'
      - 'tests_standalone/test_save_maintenance_r818.py'
      - 'docs/SAVE_MAINTENANCE_R818.md'
      - '.github/workflows/save-maintenance-r818.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Save maintenance tests
        run: python -m unittest discover -s tests_standalone -p test_save_maintenance_r818.py -v
      - name: Long-session replay and recovery compatibility
        run: |
          python -m unittest discover -s tests_standalone -p test_long_session_r8.py -v
          python -m unittest discover -s tests_standalone -p test_long_session_player_r8.py -v
          python -m unittest discover -s tests_standalone -p test_persistence_v2.py -v
          python -m unittest discover -s tests_standalone -p test_save_contract.py -v
