name: R51.A Declarative UI Contract
on:
  pull_request:
    paths:
      - 'sporebound/ui_layout_r51.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/studio/r51_layout_authoring.py'
      - 'tests_standalone/test_r51a_ui_layout.py'
      - '.github/workflows/r51a-ui-contract.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/ui_layout_r51.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/studio/r51_layout_authoring.py'
      - 'tests_standalone/test_r51a_ui_layout.py'
permissions:
  contents: read
jobs:
  headless-schema-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R51 contract, migration rejection and transactional authoring
        run: python -m unittest -v tests_standalone.test_r51a_ui_layout
      - name: CT, legacy GameProject and session regressions
        run: python -m unittest -v tests_standalone.test_r25_foundation tests_standalone.test_player_hud_layout_r710
