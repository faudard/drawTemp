name: DrawTemp R49.A Creator Experience

on:
  pull_request:
    paths:
      - 'drawtemp/studio/r49_experience.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r49_experience.py'
      - 'docs/drawtemp5/R49A_CREATOR_EXPERIENCE.md'
      - '.github/workflows/r49-creator-experience.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/r49_experience.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_r49_experience.py'
      - 'docs/drawtemp5/R49A_CREATOR_EXPERIENCE.md'
      - '.github/workflows/r49-creator-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-audit:
    name: R49.A contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install Studio
        run: python -m pip install -e ".[qt6]"
      - name: Contract and Qt smoke regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest -v tests_standalone.test_r49_experience
      - name: Compile changed Python
        run: python -m compileall -q drawtemp/studio/r49_experience.py drawtemp/studio/qt_shell.py tests_standalone/test_r49_experience.py
