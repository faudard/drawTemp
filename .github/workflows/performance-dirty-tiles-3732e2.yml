name: Dirty Tiles Occlusion 3.7.32E2
on:
  pull_request:
    paths:
      - 'sporebound/editor_dirty_tiles.py'
      - 'sporebound/editor_render_cache.py'
      - 'sporebound/iso_map.py'
      - 'tests_standalone/test_dirty_tiles_3732e2.py'
      - 'tests_standalone/test_dirty_tiles_3732e2_gui.py'
      - 'tests_standalone/test_dirty_tiles_3732e.py'
      - 'scripts/benchmark_dirty_occlusion_3732e2.py'
      - '.github/workflows/performance-dirty-tiles-3732e2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  occlusion-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk, PIL and Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-pil xvfb
      - name: Check conservative planner and old behavior
        run: >-
          python3 -m unittest -v
          tests_standalone.test_dirty_tiles_3732e
          tests_standalone.test_dirty_tiles_3732e2
      - name: Compare full and incremental Canvas with actors and buildings
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: >-
          xvfb-run -a python3 -m unittest -v
          tests_standalone.test_dirty_tiles_3732e2_gui
          tests_standalone.test_dirty_tiles_3732e_gui
          tests_standalone.test_editor_render_cache_3718d_gui
      - name: Maintain 3.7.32E terrain-only reference benchmark
        run: >-
          xvfb-run -a python3 scripts/benchmark_dirty_tiles_3732e.py
          --quick --output dirty-tiles-e2-smoke.json
      - name: Paired house / roof / tall-prop benchmark
        run: >-
          xvfb-run -a python3 scripts/benchmark_dirty_occlusion_3732e2.py
          --quick --output dirty-occlusion-e2-smoke.json
      - name: Archive benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirty-tiles-occlusion-e2
          path: |
            dirty-tiles-e2-smoke.json
            dirty-occlusion-e2-smoke.json
          if-no-files-found: warn
