name: DrawTemp 5 R5 Map Studio
on:
  pull_request:
    paths:
      - 'drawtemp/studio/map_*.py'
      - 'drawtemp/render/IsoViewport.qml'
      - 'drawtemp/render/TacticalBoard.qml'
      - 'drawtemp/render/iso_scene.py'
      - 'drawtemp/render/qt_viewport.py'
      - 'tests_standalone/test_drawtemp5_shared_viewport.py'
      - 'tests_standalone/test_drawtemp5_r5_*.py'
      - 'drawtemp/render/autotile.py'
      - 'drawtemp/studio/map_dragdrop.py'
      - 'pyproject.toml'
      - '.github/workflows/drawtemp5-r5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authoring:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Transactional map authoring tests
        run: python -m unittest tests_standalone.test_drawtemp5_r5_map tests_standalone.test_drawtemp5_r5_layers tests_standalone.test_drawtemp5_r5_smart_palette tests_standalone.test_drawtemp5_shared_viewport tests_standalone.test_drawtemp5_r1_authoring -v
  qt-offscreen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install software Qt dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: Launch R5 Widgets + Quick map preview
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m drawtemp.studio.map_editor --smoke
          python -m unittest tests_standalone.test_drawtemp5_r5_layers_qt tests_standalone.test_drawtemp5_r5_smart_palette_qt -v
