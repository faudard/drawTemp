name: R20.B Jeanne playable village forest refuge

on:
  pull_request:
    paths:
      - "sporebound/content/jeanne.r20b.game.json"
      - "sporebound/content/jeanne.game.json"
      - "sporebound/content/jeanne.json"
      - "sporebound/exploration.py"
      - "sporebound/game_session.py"
      - "tests_standalone/test_r20b_jeanne_playable.py"
      - ".github/workflows/drawtemp-r20b-jeanne.yml"
  workflow_dispatch:

jobs:
  r20b-cross-platform:
    name: R20.B cross-platform real tactical path
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Run headless R20.B plus original Jeanne regression
        run: python -m unittest tests_standalone.test_r20b_jeanne_playable tests_standalone.test_jeanne_acte1 tests_standalone.test_jeanne_prologue -v
