name: R26 Action Runtime Headless
on:
  pull_request:
    paths:
      - "sporebound/action_runtime.py"
      - "tests_standalone/test_action_runtime_r26.py"
      - "examples/action_runtime_r26.py"
      - "docs/R26_ACTION_RUNTIME_FOUNDATION.md"
      - ".github/workflows/r26-action-runtime.yml"
  push:
    branches:
      - master
      - feat/r26-action-runtime-foundation
permissions:
  contents: read
jobs:
  action-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Verify fixed-tick action contracts and replay
        run: python -m unittest discover -s tests_standalone -p test_action_runtime_r26.py -v
      - name: Run action headless scenario
        run: python -m examples.action_runtime_r26
      - name: Preserve historical tactical GameSession smoke
        run: python -m unittest tests_standalone.test_game_session -v
