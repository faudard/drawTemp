name: R37 Advanced AI Decision

on:
  pull_request:
    paths:
      - 'sporebound/advanced_ai.py'
      - 'sporebound/ai_perception.py'
      - 'sporebound/game_session.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/sdk/ai_decision.py'
      - 'drawtemp/sdk/behavior_tree.py'
      - 'drawtemp/studio/ai_tree_authoring.py'
      - 'drawtemp/studio/ai_tree_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/sdk/__init__.py'
      - 'tests_standalone/test_r37_ai_decision.py'
      - 'tests_standalone/test_r37_ai_session.py'
      - 'tests_standalone/test_r37_behavior_tree.py'
      - 'tests_standalone/test_r37_behavior_tree_qt.py'
      - 'tests_standalone/test_r37_perception.py'
      - '.github/workflows/r37-ai-decision.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/advanced_ai.py'
      - 'sporebound/ai_perception.py'
      - 'sporebound/game_session.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/sdk/ai_decision.py'
      - 'drawtemp/sdk/behavior_tree.py'
      - 'drawtemp/studio/ai_tree_authoring.py'
      - 'drawtemp/studio/ai_tree_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/sdk/__init__.py'
      - 'tests_standalone/test_r37_ai_decision.py'
      - 'tests_standalone/test_r37_ai_session.py'
      - 'tests_standalone/test_r37_behavior_tree.py'
      - 'tests_standalone/test_r37_behavior_tree_qt.py'
      - 'tests_standalone/test_r37_perception.py'
      - '.github/workflows/r37-ai-decision.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless-ai-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: R37.A versioned context, blackboard, deterministic utility
        run: python -m unittest tests_standalone.test_r37_ai_decision -v
      - name: R37.B GameSession memory and canonical facts
        run: python -m unittest tests_standalone.test_r37_ai_session -v
      - name: R35/R25 realtime and legacy checkpoint compatibility
        run: python -m unittest tests_standalone.test_r35_living_world tests_standalone.test_r25_fixed_realtime tests_standalone.test_game_session -v
      - name: R37.C Behavior Trees and transactional authoring
        run: python -m unittest tests_standalone.test_r37_behavior_tree -v
      - name: R37.D R35/R25 world perception and replay
        run: python -m unittest tests_standalone.test_r37_perception -v
      - name: R31 compatible declarative graph contracts
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_graph -v

  qt-behavior-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional Qt editor
        run: python -m pip install -e ".[qt6]"
      - name: R37.C visual tree, diagnostics and Undo/Redo
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests_standalone.test_r37_behavior_tree_qt -v
