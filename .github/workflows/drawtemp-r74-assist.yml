name: DrawTemp R74 Assisted Dungeon Studio
on:
  pull_request:
    paths:
      - 'drawtemp/studio/r74_assisted_dungeons.py'
      - 'drawtemp/studio/r74_assist_qt.py'
      - 'drawtemp/studio/r74_physical_dungeons.py'
      - 'drawtemp/studio/r74_spatial_dungeons.py'
      - 'drawtemp/studio/r74_player_validation.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r74_assisted_dungeons.py'
      - 'tests_standalone/test_drawtemp_r74_assist_qt.py'
      - 'tests_standalone/test_drawtemp_r74_physical_dungeons.py'
      - 'tests_standalone/test_drawtemp_r74_spatial_dungeons.py'
      - 'tests_standalone/test_drawtemp_r74_player_validation.py'
      - 'docs/R74_ASSISTED_DUNGEONS.md'
      - '.github/workflows/drawtemp-r74-assist.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r74-assisted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Deterministic graph, provenance, canonical undo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verify R74 code and test syntax
        run: >-
          python -m compileall -q
          drawtemp/studio/r74_assisted_dungeons.py
          drawtemp/studio/r74_assist_qt.py
          drawtemp/studio/r74_physical_dungeons.py
          drawtemp/studio/r74_spatial_dungeons.py
          drawtemp/studio/r74_player_validation.py
          tests_standalone/test_drawtemp_r74_assisted_dungeons.py
          tests_standalone/test_drawtemp_r74_assist_qt.py
          tests_standalone/test_drawtemp_r74_physical_dungeons.py
          tests_standalone/test_drawtemp_r74_spatial_dungeons.py
          tests_standalone/test_drawtemp_r74_player_validation.py
      - name: R74 headless and R34 regression
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r74_assisted_dungeons
          tests_standalone.test_drawtemp_r74_physical_dungeons
          tests_standalone.test_drawtemp_r74_spatial_dungeons
          tests_standalone.test_drawtemp_r74_player_validation
          tests_standalone.test_drawtemp5_r27_dungeon
          tests_standalone.test_drawtemp5_r27d_journey
          tests_standalone.test_procgen_r34
          tests_standalone.test_procgen_prefabs_r34b
          tests_standalone.test_roguelite_r34c
          -v

  qt-offscreen:
    name: Qt consent, diff and undo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: R74 offscreen interactions and Studio command registration
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r74_assist_qt
          tests_standalone.test_drawtemp_r30g_qt
          -v
      - name: Studio startup smoke, not GPU certification
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke
