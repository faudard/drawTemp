name: R65 Action Combat Headless
on:
  pull_request:
    paths:
      - 'sporebound/action_combat_r65.py'
      - 'tests_standalone/test_action_combat_r65.py'
      - 'docs/drawtemp5/R65_A_ACTION_COMBAT.md'
      - '.github/workflows/r65-action-combat.yml'
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  r65-action-combat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R65 combat - headless fixed tick, replay and collision
        run: python -m unittest -v tests_standalone.test_action_combat_r65
      - name: R26 and tactical compatibility
        run: python -m unittest -v tests_standalone.test_action_runtime_r26 tests_standalone.test_game_session
