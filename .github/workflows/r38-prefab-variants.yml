name: DrawTemp R38.2 Prefab Variants

on:
  pull_request:
    paths:
      - 'sporebound/prefab_variants.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/studio/r38_prefabs_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r38_prefabs.py'
      - 'docs/R38_2_PREFAB_VARIANTS.md'
      - '.github/workflows/r38-prefab-variants.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefab-headless:
    name: R38.2 headless / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests_standalone.test_drawtemp_r38_prefabs.PrefabVariantTests -v
      - run: python -m unittest tests_standalone.test_editor_group_prefabs_3725 -v
      - run: python -m unittest tests_standalone.test_drawtemp5_r24g -v

  prefab-qt:
    name: R38.2 Qt offscreen / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - run: python -m unittest tests_standalone.test_drawtemp_r38_prefabs.PrefabVariantQtTests -v
