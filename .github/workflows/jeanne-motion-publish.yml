name: Publish Jeanne watercolor motion

on:
  push:
    branches:
      - art/jeanne-motion-complete-20261014
      - consolidate/drawtemp5-r3-r14-20261015
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeanne-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authoring-only dependencies
        run: python -m pip install "Pillow==11.3.0" "numpy==2.2.6" "opencv-python-headless==4.12.0.88"
      - name: Install repository package for generator imports
        run: python -m pip install -e .
      - name: Generate 11 new transparent PNG cels
        run: python scripts/generate_jeanne_motion.py --root assets/watercolor
      - name: Verify all 99 watercolor PNGs
        run: python scripts/verify_watercolor_release.py --root assets/watercolor
      - name: Check frame counts, provenance and animation catalog
        run: python -m unittest tests_standalone.test_watercolor_catalog tests_standalone.test_jeanne_motion_pack -v
      - name: Commit generated binaries and animation registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/watercolor/index.json assets/watercolor/registry.json assets/watercolor/provenance.json assets/watercolor/sprites/jeanne_motion
          if ! git diff --cached --quiet; then
            git commit -m "art(jeanne): publish PNG motion frames (8 walk, 12 attack)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
