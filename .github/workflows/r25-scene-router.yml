name: R25 SceneRouter Persistence
on:
  pull_request:
    paths:
      - 'sporebound/scene_router.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'tests_standalone/test_r25_scene_router.py'
      - '.github/workflows/r25-scene-router.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/scene_router.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'tests_standalone/test_r25_scene_router.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  routed-campaign-headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: R25.B routed scenes, tactical replay, save/load
        run: python -m unittest tests_standalone.test_r25_scene_router -v
      - name: R25.A opt-in profiles and fixed-tick regression
        run: python -m unittest tests_standalone.test_r25_foundation -v
      - name: Existing GameSession persistence, CT and campaign regression
        run: python -m unittest tests_standalone.test_game_session -v
