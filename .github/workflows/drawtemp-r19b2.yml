name: DrawTemp R19.B2 committed visual clips

on:
  pull_request:
    paths:
      - "drawtemp/render/visual_clip_frames.py"
      - "drawtemp/render/qt_viewport.py"
      - "drawtemp/render/TacticalBoard.qml"
      - "tests_standalone/test_drawtemp5_r19b2_visual_clips.py"
      - "tests_standalone/test_drawtemp5_r19b2_qt.py"
      - ".github/workflows/drawtemp-r19b2.yml"
  push:
    branches: [master]
    paths:
      - "drawtemp/render/visual_clip_frames.py"
      - "drawtemp/render/qt_viewport.py"
      - "drawtemp/render/TacticalBoard.qml"
      - "tests_standalone/test_drawtemp5_r19b2_visual_clips.py"
      - "tests_standalone/test_drawtemp5_r19b2_qt.py"
      - ".github/workflows/drawtemp-r19b2.yml"

jobs:
  headless-clips:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest tests_standalone.test_drawtemp5_r19b2_visual_clips tests_standalone.test_drawtemp5_r12_animation -v

  qt-clip-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[art,qt6]"
      - run: python -m unittest tests_standalone.test_drawtemp5_r19b2_qt tests_standalone.test_drawtemp5_r127_visual_qt -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
