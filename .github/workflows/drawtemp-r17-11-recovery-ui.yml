name: DrawTemp R17.11 Player Recovery UX
on:
  pull_request:
    paths:
      - 'drawtemp/player/**'
      - 'drawtemp/sdk/slots.py'
      - 'tests_standalone/test_r17_recovery_ux*.py'
      - '.github/workflows/drawtemp-r17-11-recovery-ui.yml'
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    name: R17.11 recovery model / ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Recovery safety, replay and fault injection
        run: >-
          python -m unittest
          tests_standalone.test_r17_recovery_ux
          tests_standalone.test_r17_persistence_recovery
          tests_standalone.test_drawtemp5_r12_save_manager
          tests_standalone.test_drawtemp5_r1d -v
  qt:
    name: R17.11 real Player QML / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install '.[qt6]'
      - name: QML modal + Player bridge and prior R12 regression
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_r17_recovery_ux_qt
          tests_standalone.test_drawtemp5_r12_save_manager_qt -v
