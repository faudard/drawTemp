name: DrawTemp R17.C1 Event Pages Recovery
on:
  pull_request:
    paths:
      - 'sporebound/event_pages.py'
      - 'sporebound/event_composer.py'
      - 'sporebound/event_graph.py'
      - 'sporebound/model.py'
      - 'sporebound/engine.py'
      - 'sporebound/game_session.py'
      - 'sporebound/rules/triggers.py'
      - 'sporebound/tactical_rpg3.py'
      - 'drawtemp/studio/events.py'
      - 'tests_standalone/test_drawtemp5_r9d.py'
      - 'tests_standalone/test_r17c_event_integration.py'
      - '.github/workflows/drawtemp-r17c-event-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-pages-headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: R9.D pages, replay, authoring and legacy compatibility
        run: python -m unittest tests_standalone.test_drawtemp5_r9d tests_standalone.test_r17c_event_integration tests_standalone.test_drawtemp5_r9 tests_standalone.test_drawtemp5_r9b tests_standalone.test_drawtemp5_r1_authoring -v
