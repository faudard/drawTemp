name: DrawTemp R17 Reintegrated Release Gates
on:
  pull_request:
    paths:
      - 'drawtemp/export/**'
      - 'drawtemp/player/**'
      - 'drawtemp/sdk/slots.py'
      - 'tests_standalone/test_r17*'
      - '.github/workflows/drawtemp-r17-reintegration.yml'
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    name: Rights + checkpoint + recovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: R17.6/R17.7/R17.11 + R1/R12/R15
        run: >-
          python -m unittest -v
          tests_standalone.test_r17_asset_rights
          tests_standalone.test_r17_persistence_recovery
          tests_standalone.test_r17_recovery_ux
          tests_standalone.test_drawtemp5_r1d
          tests_standalone.test_drawtemp5_r1e
          tests_standalone.test_drawtemp5_r12_save_manager
          tests_standalone.test_drawtemp5_r15
          tests_standalone.test_drawtemp5_r15_creator
  qt:
    name: Qt Player UX / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install '.[qt6]'
      - name: Real QML recovery modal and stale consent
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest -v
          tests_standalone.test_r17_recovery_ux_qt
          tests_standalone.test_drawtemp5_r12_save_manager_qt
