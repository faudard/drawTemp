name: R55 System Designer

on:
  pull_request:
    paths:
      - 'sporebound/system_design.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'drawtemp/studio/system_design_*.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/sdk/simulation.py'
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'examples/r55_micro_economy.py'
      - 'tests_standalone/test_r55_*.py'
      - '.github/workflows/r55-system-designer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r55-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R55 deterministic systems, multizone Player/save and compatibility
        run: python -m unittest tests_standalone.test_r55_system_design -v
      - name: R55 Player SDK and Studio-to-Player VS-55
        run: python -m unittest tests_standalone.test_r55_player_sdk -v
      - name: VS-55 executable two-scene proof
        run: python -m examples.r55_micro_economy
      - name: R55 legacy realtime and R35 world regression
        run: >-
          python -m unittest
          tests_standalone.test_r25_scene_router
          tests_standalone.test_r35_living_world -v
  r55-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: R55 Qt native designer and Undo/Redo
        run: python -m unittest tests_standalone.test_r55_system_design_gui -v
      - name: R55 QML Player bridge loading smoke
        env:
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.player.qt_app --smoke --reference
