name: R63 Survival Headless Contracts

on:
  pull_request:
    paths:
      - 'sporebound/survival.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'drawtemp/sdk/simulation.py'
      - 'drawtemp/studio/survival_authoring.py'
      - 'tests_standalone/test_r63_survival.py'
      - 'tests_standalone/test_r63_player.py'
      - 'tests_standalone/test_r63_survival_gui.py'
      - 'drawtemp/studio/survival_designer_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - '.github/workflows/r63-survival.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r63-survival-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  survival-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R63 typed contracts, replay and VS-63
        run: >-
          python -m unittest tests_standalone.test_r63_survival
          tests_standalone.test_r63_player -v
      - name: R55 economy / R25 movement compatibility
        run: python -m unittest tests_standalone.test_r55_system_design tests_standalone.test_r25_scene_router -v
  survival-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: R63 Qt Studio authoring, map placement and Undo/Redo
        run: python -m unittest tests_standalone.test_r63_survival_gui -v
      - name: R63 Player Qt QML loading smoke
        run: python -m drawtemp.player.qt_app --smoke --reference
