      - name: Verify 3.7.24G comparison Studio matrix, branches, reset
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_world_route_comparison_3724g_gui.py -v
      - name: Verify 3.7.24H World Studio tactical comparison Tk worker
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_world_tactical_comparison_3724h_gui.py -v
      - name: R1.9 GUI gate — bridge drag, entity inspector and event wizard
