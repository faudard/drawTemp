      - name: Campaign Flow R5.13 — visual Tk authoring, undo/redo and save
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest tests_standalone.test_campaign_flow_authoring_r513_gui -v
      - name: Verify R7.19 Cinematic Studio motion-keyframes, contextual UX and Undo/Redo
        env:
