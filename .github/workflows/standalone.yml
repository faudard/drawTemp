      - name: Generate 3.7.20C layered-house example via public authoring APIs
        run: python3 -m examples.layered_house_3720c --output "${{ runner.temp }}/layered_house_3720c.json"
      - name: Build playable fortified village with existing authoring commands (3.7.17A)
        run: python3 -m examples.fortified_village_3717a --output "${{ runner.temp }}/reference-village/fortified_village.json"
