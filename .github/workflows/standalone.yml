name: Standalone gameplay
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# Obsolete PR heads must not monopolize the 9-run Python/OS matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests_standalone -v
      - run: python -m sporebound validate
      - name: Verify 2.7 advanced castle phase and replay
        run: python -m examples.tactical_rpg3_castle
      - name: Validate portable asset example
        run: |
          python examples/asset_pipeline.py --output "${{ runner.temp }}/asset-demo"
          python -m sporebound validate --project "${{ runner.temp }}/asset-demo/game.json"
      - name: Verify complete campaigns and resumed replays
        run: python -m examples.reliability_gate --seeds 1 7 42 99 --output reliability.json
      - name: Preserve reliability measurements
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.os }}-${{ matrix.python }}
          path: reliability.json
          if-no-files-found: error
      - run: python -m sporebound simulate --mission garden --seed 42 --save battle.json
      - run: python -m sporebound replay --load battle.json
      - name: Installed package and bundled content outside checkout
        working-directory: ${{ runner.temp }}
        run: sporebound validate
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Exercise the real editor
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_editor_gui.py -v
      - name: Exercise guided studio and title/campaign flows
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_studio_gui.py -v
      - name: Exercise 2.6 Audio Studio import and sound cues
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_audio_studio_gui.py -v
      - name: Exercise cinematic timeline authoring and playback
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_cinematics_gui.py -v
      - name: Exercise 2.5.4 visual Campaign & Siege Studio
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_campaign_siege_gui.py -v
      - name: Exercise 2.5.5 workspace navigation and guided creation
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_workspace_gui.py -v
      - name: Exercise 2.5.1 map selection and deployment UI
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_map_editor_gui.py -v
      - name: Exercise 2.5.3.2 visual synergy unlock and secret combinations
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_synergy_unlock_gui.py -v
      - name: Exercise 2.5.3.3 class progression graph and tactical AI editor
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_class_ai_gui.py -v
      - name: Exercise 2.5.3 character and rules Studio authoring
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_character_rules_gui.py -v
      - name: Exercise advanced graph and standalone player UI
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_studio_advanced_gui.py -v
      - name: Exercise conditional narrative and player dialogue
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_narrative_gui.py -v
      - name: Exercise 2.5.2 conditional story designer and runtime preview
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_story_conditions_gui.py -v
      - name: Exercise 2.5.2 tactical event graph Tk authoring
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_event_graph_gui.py -v
      - name: Exercise unfolded story tree authoring
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_story_graph_gui.py -v
      - name: Exercise full Studio to Player talent progression under Xvfb
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_tactical_e2e_gui.py -v
      - name: Exercise the real command center
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_command_gui.py -v
      - name: Exercise the new GameSession player
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_player_26_gui.py -v
      - name: Exercise Jeanne atlas PNG crop in Tk (3.7.5)
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_jeanne_atlas_gui.py -v
      - name: Collect real Tk renderer evidence (3.7.5)
        run: >-
          xvfb-run -a python3 scripts/collect_renderers_375.py
          --backends tk --actors 20 80 --scales 1 2
          --repeats 2 --frames 120
          --output "${{ runner.temp }}/tk-renderer-375.json"
      - name: Preserve Tk renderer measurements
        uses: actions/upload-artifact@v4
        with:
          name: renderer-375-ubuntu-tk
          path: ${{ runner.temp }}/tk-renderer-375.json
          if-no-files-found: error
      - name: Exercise 2.5.4.2 authored siege in the Player and resume it
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_configured_siege_player_gui.py -v
      - name: Exercise 2.5.4.4 route and diplomacy authoring in Tk and Player
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_routes_diplomacy_gui.py -v
      - name: Exercise Game Studio 4 cutscenes and resumed dialogue in Player
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_scene_cinematics_gui.py -v
      - name: Exercise Game Studio 4 guided campaign / siege wizard
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_studio_siege_flow_gui.py -v
      - name: Exercise Game Studio 4 strategic-narrative authoring in Tk
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_strategic_narrative_bridge_gui.py -v
      - name: Exercise 2.5.4.5 Strategic Event Graph UI and journaled replay
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_strategic_event_graph_gui.py -v
      - name: Exercise 2.8.1 Castle Player GUI and resumable siege
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_castle_player_gui.py -v
      - name: Exercise 2.8.2 Studio-authored siege Player and narrative bridge
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_authored_siege_gui.py -v
      - name: Exercise 2.5.4.3 visual logistics graph and live Player convoys
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_logistics_studio_gui.py -v
      - name: Verify Jeanne tactical canvas zoom, culling and frame purity (3.7.6)
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_player_canvas_376_gui.py -v
      - name: Measure real Jeanne BattleFrame rendering (3.7.6)
        run: >-
          xvfb-run -a python3 scripts/benchmark_player_canvas_376.py
          --actors 80 --cell 52 --frames 120
          --output "${{ runner.temp }}/player-canvas-376.json"
      - name: Preserve 3.7.6 real canvas benchmark
        uses: actions/upload-artifact@v4
        with:
          name: player-canvas-376-ubuntu
          path: ${{ runner.temp }}/player-canvas-376.json
          if-no-files-found: error
      - name: Verify cached terrain and fresh combat overlays in Tk (3.7.7)
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_player_canvas_377_gui.py -v
      - name: Measure cached terrain on real authored Jeanne battle (3.7.7)
        run: >-
          xvfb-run -a python3 scripts/benchmark_player_canvas_376.py
          --actors 0 --cell 52 --frames 120
          --output "${{ runner.temp }}/player-canvas-377-authored.json"
      - name: Measure cached terrain at 80 actors (3.7.7)
        run: >-
          xvfb-run -a python3 scripts/benchmark_player_canvas_376.py
          --actors 80 --cell 52 --frames 120
          --output "${{ runner.temp }}/player-canvas-377-stress.json"
      - name: Preserve 3.7.7 layer cache evidence
        uses: actions/upload-artifact@v4
        with:
          name: player-canvas-377-ubuntu
          path: |
            ${{ runner.temp }}/player-canvas-377-authored.json
            ${{ runner.temp }}/player-canvas-377-stress.json
          if-no-files-found: error
      - name: Verify persistent actor sprites, HP and culling in Tk (3.7.8)
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_player_actors_378_gui.py -v
      - name: Measure incremental actors on authentic Jeanne battle (3.7.8)
        run: >-
          xvfb-run -a python3 scripts/benchmark_player_canvas_376.py
          --actors 0 --cell 52 --frames 120
          --output "${{ runner.temp }}/player-canvas-378-authored.json"
      - name: Measure incremental actors with 80 presentation-only actors (3.7.8)
        run: >-
          xvfb-run -a python3 scripts/benchmark_player_canvas_376.py
          --actors 80 --cell 52 --frames 120
          --output "${{ runner.temp }}/player-canvas-378-stress.json"
      - name: Preserve 3.7.8 incremental actor benchmark
        uses: actions/upload-artifact@v4
        with:
          name: player-canvas-378-ubuntu
          path: |
            ${{ runner.temp }}/player-canvas-378-authored.json
            ${{ runner.temp }}/player-canvas-378-stress.json
          if-no-files-found: error
