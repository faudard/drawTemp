name: Standalone gameplay
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# Obsolete PR heads must not monopolize the 9-run Python/OS matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Verify 3.7.24A World Map model and legacy save compatibility
        run: python -m unittest tests_standalone.test_world_map_3724a -v
      - name: Verify 3.7.24B continuous world travel and resume
        run: python -m unittest tests_standalone.test_world_travel_3724b -v
      - name: Verify 3.7.24C authored road events and StoryBook choices
        run: python -m unittest tests_standalone.test_world_events_3724c -v
      - name: Verify 3.7.24D multiple encounters, forks and backtracking
        run: python -m unittest tests_standalone.test_world_forks_3724d -v
      - name: Verify 3.7.24E world event authoring, route picking and persistence
        run: python -m unittest tests_standalone.test_world_event_studio_3724e -v
      - name: Verify 3.7.24F route sandbox and real StoryBook consequences
        run: python -m unittest tests_standalone.test_world_travel_lab_3724f -v
      - name: Verify 3.7.24G branching route comparison and isolation
        run: python -m unittest tests_standalone.test_world_route_comparison_3724g -v
      - name: Verify 3.7.24H contextual Battle Lab and route tactical evidence
        run: python -m unittest tests_standalone.test_world_tactical_comparison_3724h -v
      - name: Generate and validate a playable 3.7.24A World Map campaign
        run: |
          python -m examples.world_map_3724a --output "${{ runner.temp }}/world-3724a.json"
          python -m sporebound validate --content "${{ runner.temp }}/world-3724a.json" --project "${{ runner.temp }}/world-3724a.game.json"
      - name: Verify 3.7.32C Map Builder layer locking and sidecar state
        run: python -m unittest discover -s tests_standalone -p test_map_layer_workspace_3732c.py -v
      - name: Verify Map Builder 4.0D rotated reusable prefabs and model references
        run: python -m unittest tests_standalone.test_map_builder4_3732d -v
      - name: Verify 3.7.32E reproducible assisted quarter proposals and model safety
        run: python -m unittest tests_standalone.test_map_builder4_3732e -v
      - name: Campaign Simulation R5.14 — forks, comparison and save isolation
        run: python -m unittest tests_standalone.test_campaign_flow_simulation_r514 -v
      - name: Campaign Flow R5.13 — visual authoring transactions and runtime parity
        run: python -m unittest tests_standalone.test_campaign_flow_authoring_r513 -v
      - name: Campaign Flow R5.B — gated progression, save identity and portable export
        run: python -m unittest tests_standalone.test_campaign_flow_r5b -v
      - name: Campaign Flow R5.B — checkpoint-backed branch QA report
        run: python scripts/campaign_flow_qa.py --content sporebound/content/core.json --project sporebound/content/core.game.json --report campaign_flow_qa.json
      - name: Preserve Campaign Flow R5.B QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-flow-r5b-${{ matrix.os }}-${{ matrix.python }}
          path: campaign_flow_qa.json
          if-no-files-found: warn
      - run: python -m unittest discover -s tests_standalone -v
      - name: Battle Lab 3.8 CLI report and paired deterministic replay gate
        run: |
          python -m sporebound battle-lab --content sporebound/content/core.json --mission garden --seed 1 --runs 2 --limit 40 --report battle_lab_ci.json
          python -m sporebound battle-lab --content sporebound/content/core.json --mission garden --seed 1 --runs 2 --limit 40 --baseline battle_lab_ci.json
      - name: Balance Matrix 3.8.2 paired missions, rules and replay smoke
        run: |
          python -m sporebound balance-matrix --content sporebound/content/core.json --matrix-cases examples/balance_matrix_382_cases.json --seed 1 --runs 2 --limit 40 --report matrix_382_ci.json > matrix_382_console.json
          python -m sporebound balance-matrix --content sporebound/content/core.json --matrix-cases examples/balance_matrix_382_cases.json --seed 1 --runs 2 --limit 40 --baseline matrix_382_ci.json > matrix_382_compare.json
      - name: Visual Battle Lab 3.8.3 deterministic figures and CT replay
        run: python -m unittest tests_standalone.test_battle_visual_383 -v
      - name: Combat Diagnostics 3.8.1 canonical trace and CLI replay evidence
        run: python -m sporebound battle-diagnostics --content sporebound/content/core.json --mission garden --seed 42 --limit 40 --report battle_diagnostics_ci.json
      - name: Human Playtest Telemetry 3.8.4 opt-in, committed events and privacy
        run: python -m unittest tests_standalone.test_playtest_384 -v
      - name: R6 profiles, AI explainability, strict regression and campaign curves
        run: python -m unittest tests_standalone.test_encounter_balance_r6 -v
      - name: R6.14 tactical choice gate — real executable options and replay
        run: python -m unittest tests_standalone.test_tactical_choice_r6 -v
      - name: R6.14 bounded CLI report (zero optional multi-choice quota for smoke)
        run: >-
          python -m sporebound tactical-choices --content sporebound/content/core.json --mission garden
          --seed 1 --limit 60 --choice-min-multi 0
          --report tactical_choices_ci.json
      - name: R6.14 repeat identical choices against saved reference
        run: >-
          python -m sporebound tactical-choices --content sporebound/content/core.json --mission garden
          --seed 1 --limit 60 --choice-min-multi 0
          --baseline tactical_choices_ci.json
      - name: R6.15 one-command tactical quality and human-gate tests
        run: python -m unittest tests_standalone.test_tactical_quality_r615 -v
      - name: R6.15 report — automated probe is not human certification
        run: >-
          python -m sporebound tactical-quality --content sporebound/content/core.json --mission garden
          --seed 1 --limit 20 --quality-min-differentiated 0
          --quality-min-tradeoffs 0 --report tactical_quality_ci.json
      - name: R6.16 full activation decision quality and replay
        run: python -m unittest tests_standalone.test_full_activation_r616 -v
      - name: R6.16 headless complete turn smoke (no design claim)
        run: >-
          python -m sporebound full-activation --content sporebound/content/core.json --mission garden
          --seed 1 --limit 20 --activation-min-distinct 0
          --activation-min-pairs 0 --report full_activation_ci.json
      - run: python -m sporebound validate
      - name: Verify 2.7 advanced castle phase and replay
        run: python -m examples.tactical_rpg3_castle
      - name: Validate portable asset example
        run: |
          python examples/asset_pipeline.py --output "${{ runner.temp }}/asset-demo"
          python -m sporebound validate --content sporebound/content/core.json --project "${{ runner.temp }}/asset-demo/game.json"
      - name: Verify complete campaigns and resumed replays
        run: python -m examples.reliability_gate --seeds 1 7 42 99 --output reliability.json
      - name: Preserve reliability measurements
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.os }}-${{ matrix.python }}
          path: reliability.json
          if-no-files-found: error
      - run: python -m sporebound simulate --content sporebound/content/core.json --mission garden --seed 42 --save battle.json
      - run: python -m sporebound replay --load battle.json
      - name: Installed package and bundled content outside checkout
        working-directory: ${{ runner.temp }}
        run: sporebound validate
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb python3-pil
      - name: Verify Map Builder 4.0D visual prefab palette and click-to-stamp
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest tests_standalone.test_map_builder4_3732d_gui -v
      - name: Development-only watercolor metadata check (NOT release certification)
        run: python3 -m scripts.verify_watercolor_release --root assets/watercolor --allow-missing
      - name: Exercise the real editor
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_editor_gui.py -v
      - name: Verify 3.7.24A World Map drag, undo/save and shared Player renderer
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_world_map_3724a_gui.py -v
      - name: Verify 3.7.24E visual road events Studio, Undo Redo Save All
        env:
