name: Standalone gameplay
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# Obsolete PR heads must not monopolize the 9-run Python/OS matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests_standalone -v
      - run: python -m sporebound validate
      - name: Verify 2.7 advanced castle phase and replay
        run: python -m examples.tactical_rpg3_castle
      - name: Validate portable asset example
        run: |
          python examples/asset_pipeline.py --output "${{ runner.temp }}/asset-demo"
          python -m sporebound validate --project "${{ runner.temp }}/asset-demo/game.json"
      - name: Verify complete campaigns and resumed replays
        run: python -m examples.reliability_gate --seeds 1 7 42 99 --output reliability.json
      - name: Preserve reliability measurements
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.os }}-${{ matrix.python }}
          path: reliability.json
          if-no-files-found: error
      - run: python -m sporebound simulate --mission garden --seed 42 --save battle.json
      - run: python -m sporebound replay --load battle.json
      - name: Installed package and bundled content outside checkout
        working-directory: ${{ runner.temp }}
        run: sporebound validate
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Exercise the real editor
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_editor_gui.py -v
      - name: Exercise guided studio and title/campaign flows
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_studio_gui.py -v
      - name: Exercise 2.5.5 workspace navigation and guided creation
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_workspace_gui.py -v
      - name: Exercise 2.5.1 map selection and deployment UI
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_map_editor_gui.py -v
      - name: Exercise 2.5.3.2 visual synergy unlock and secret combinations
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_synergy_unlock_gui.py -v
      - name: Exercise 2.5.3.3 class progression graph and tactical AI editor
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_class_ai_gui.py -v
      - name: Exercise 2.5.4.1 visual siege authoring and strategic timeline
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_siege_studio_gui.py -v
      - name: Exercise 2.5.3 character and rules Studio authoring
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_character_rules_gui.py -v
      - name: Exercise advanced graph and standalone player UI
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_studio_advanced_gui.py -v
      - name: Exercise conditional narrative and player dialogue
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_narrative_gui.py -v
      - name: Exercise 2.5.2 conditional story designer and runtime preview
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_story_conditions_gui.py -v
      - name: Exercise 2.5.2 tactical event graph Tk authoring
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_event_graph_gui.py -v
      - name: Exercise unfolded story tree authoring
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_story_graph_gui.py -v
      - name: Exercise full Studio to Player talent progression under Xvfb
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_tactical_e2e_gui.py -v
      - name: Exercise the real command center
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_command_gui.py -v
      - name: Exercise the new GameSession player
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_player_26_gui.py -v
