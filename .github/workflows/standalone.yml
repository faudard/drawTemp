        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_iso_interiors_3720a_gui.py -v
      - name: Exercise 3.7.20B editable upper-deck presentation in Tk
        env:
          SPOREBOUND_GUI_SMOKE: '1'
        run: xvfb-run -a python3 -m unittest discover -s tests_standalone -p test_interior_levels_3720b_gui.py -v
      - name: Verify 3.7.25 moved upper floors, roof toggling and picking at three zooms
