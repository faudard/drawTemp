name: DrawTemp R31.AB Visual Logic Studio
on:
  pull_request:
    paths:
      - 'drawtemp/sdk/logic_graph.py'
      - 'drawtemp/studio/logic_graph_draft.py'
      - 'drawtemp/studio/logic_graph_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r31_logic_graph.py'
      - 'tests_standalone/test_drawtemp_r31_logic_qt.py'
      - 'docs/drawtemp5/R31A_VISUAL_GRAPH_ADR.md'
      - 'docs/drawtemp5/R31B_LOGIC_STUDIO.md'
      - '.github/workflows/r31-visual-graph.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-r9-contract:
    name: Visual graph / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Visual graph schema, R9 compiler, sandbox and atomic persistence
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_graph -v
      - name: Preserve canonical R9 Event Graph contract
        run: python -m unittest tests_standalone.test_drawtemp5_r9 -v
      - name: Preserve canonical R1 authoring transactions
        run: python -m unittest tests_standalone.test_drawtemp5_r1_authoring -v

      - name: R31.B detached draft graph editing and stale preview
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_qt.LogicDraftTests -v

  studio-qt:
    name: R31.B Qt offscreen / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: Qt node canvas, shell integration, graph preview and undo
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_qt.VisualLogicQtTests -v
