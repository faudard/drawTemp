name: DrawTemp R31.ABCDEFGH Visual Logic Studio
on:
  pull_request:
    paths:
      - 'drawtemp/sdk/logic_graph.py'
      - 'drawtemp/sdk/logic_branches.py'
      - 'drawtemp/sdk/logic_sequence.py'
      - 'sporebound/logic_variables.py'
      - 'sporebound/logic_campaign_bridge.py'
      - 'sporebound/logic_vertical_objective.py'
      - 'drawtemp/studio/logic_vertical_slice.py'
      - 'sporebound/game_project.py'
      - 'drawtemp/sdk/logic_campaign.py'
      - 'sporebound/tactical_rpg3.py'
      - 'sporebound/engine.py'
      - 'sporebound/game_session.py'
      - 'sporebound/model.py'
      - 'drawtemp/studio/logic_graph_draft.py'
      - 'drawtemp/studio/logic_debugger.py'
      - 'sporebound/event_debugger.py'
      - 'drawtemp/studio/logic_graph_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'tests_standalone/test_drawtemp_r31_logic_graph.py'
      - 'tests_standalone/test_drawtemp_r31_logic_branches.py'
      - 'tests_standalone/test_drawtemp_r31_logic_debugger.py'
      - 'tests_standalone/test_drawtemp_r31_logic_sequence.py'
      - 'tests_standalone/test_drawtemp_r31_logic_variables.py'
      - 'tests_standalone/test_drawtemp_r31_logic_campaign.py'
      - 'tests_standalone/test_drawtemp_r31_logic_vertical_slice.py'
      - 'tests_standalone/test_drawtemp_r31_logic_qt.py'
      - 'docs/drawtemp5/R31A_VISUAL_GRAPH_ADR.md'
      - 'docs/drawtemp5/R31B_LOGIC_STUDIO.md'
      - 'docs/drawtemp5/R31C_TYPED_BRANCHES.md'
      - 'docs/drawtemp5/R31D_VISUAL_DEBUGGER.md'
      - 'docs/drawtemp5/R31E_NATIVE_WAITS_FLAGS.md'
      - 'docs/drawtemp5/R31F_TYPED_BATTLE_VARIABLES.md'
      - 'docs/drawtemp5/R31G_CAMPAIGN_BRIDGE.md'
      - 'docs/drawtemp5/R31H_PLAYER_VERTICAL_SLICE.md'
      - '.github/workflows/r31-visual-graph.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-r9-contract:
    name: Visual graph / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Visual graph schema, R9 compiler, sandbox and atomic persistence
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_graph -v
      - name: Preserve canonical R9 Event Graph contract
        run: python -m unittest tests_standalone.test_drawtemp5_r9 -v
      - name: Preserve canonical R1 authoring transactions
        run: python -m unittest tests_standalone.test_drawtemp5_r1_authoring -v

      - name: R31.B detached draft graph editing and stale preview
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_qt.LogicDraftTests -v
      - name: R31.C pure predicates, exclusive native branch dispatch and undo
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_branches -v
      - name: R31.D isolated native debugger and node tracing
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_debugger -v
      - name: R31.E native waits, journal flags and authenticated Battle replay
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_sequence -v
      - name: R31.F typed combat variables, canonical journal replay and old-manifest preservation
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_variables -v
      - name: R31.G campaign bridge, authentic victory/defeat and verified checkpoint
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_campaign -v
      - name: R31.H Studio-to-Player journey and authenticated save/replay
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_vertical_slice -v

  studio-qt:
    name: R31.BCDEFGH Qt offscreen / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: Qt node canvas, visual debugger, native breakpoint and undo
        run: python -m unittest tests_standalone.test_drawtemp_r31_logic_qt.VisualLogicQtTests -v
