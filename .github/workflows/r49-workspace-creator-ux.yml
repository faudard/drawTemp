name: DrawTemp R49.B1 Workspace and Creator UX

on:
  pull_request:
    paths:
      - 'drawtemp/studio/r49_workspaces.py'
      - 'drawtemp/studio/r49_creator_ux.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/genre_workflow.py'
      - 'drawtemp/studio/genre_wizard_qt.py'
      - 'drawtemp/export/templates.py'
      - 'tests_standalone/test_r49_workspace_focus.py'
      - 'tests_standalone/test_r49_creator_ux.py'
      - 'docs/drawtemp5/R49B1_WORKSPACE_CREATOR_UX.md'
      - '.github/workflows/r49-workspace-creator-ux.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/r49_workspaces.py'
      - 'drawtemp/studio/r49_creator_ux.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/genre_workflow.py'
      - 'drawtemp/studio/genre_wizard_qt.py'
      - 'drawtemp/export/templates.py'
      - 'tests_standalone/test_r49_workspace_focus.py'
      - 'tests_standalone/test_r49_creator_ux.py'
      - 'docs/drawtemp5/R49B1_WORKSPACE_CREATOR_UX.md'
      - '.github/workflows/r49-workspace-creator-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-and-onboarding:
    name: R49.B1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install Studio + Qt
        run: python -m pip install -e ".[qt6]"
      - name: Contract, Creator and existing R28 regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest -v
          tests_standalone.test_r49_workspace_focus
          tests_standalone.test_r49_creator_ux
          tests_standalone.test_r49_experience
          tests_standalone.test_r28_creator_workflow
      - name: Compile affected Python sources
        run: >-
          python -m compileall -q
          drawtemp/studio/r49_workspaces.py
          drawtemp/studio/r49_creator_ux.py
          drawtemp/studio/qt_shell.py
          drawtemp/studio/genre_wizard_qt.py
          drawtemp/studio/genre_workflow.py
          drawtemp/export/templates.py
      - name: Smoke Studio initialization
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke
