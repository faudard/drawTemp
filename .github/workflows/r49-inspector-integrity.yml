name: DrawTemp R49.B2 Inspector Integrity

on:
  pull_request:
    paths:
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/r49_inspector_integrity.py'
      - 'tests_standalone/test_r49_inspector_integrity.py'
      - 'docs/drawtemp5/R49B2_INSPECTOR_INTEGRITY.md'
      - '.github/workflows/r49-inspector-integrity.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/r49_inspector_integrity.py'
      - 'tests_standalone/test_r49_inspector_integrity.py'
      - 'docs/drawtemp5/R49B2_INSPECTOR_INTEGRITY.md'
      - '.github/workflows/r49-inspector-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspector-integrity:
    name: R49.B2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install Studio
        run: python -m pip install -e ".[qt6]"
      - name: R49.B2 and R18.B regression suite
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest -v
          tests_standalone.test_r49_inspector_integrity
          tests_standalone.test_drawtemp5_r18b
          tests_standalone.test_r49_workspace_focus
          tests_standalone.test_r49_creator_ux
          tests_standalone.test_r49_experience
      - name: Compile changed code
        run: >-
          python -m compileall -q
          drawtemp/studio/r49_inspector_integrity.py
          drawtemp/studio/qt_shell.py
          tests_standalone/test_r49_inspector_integrity.py
      - name: Studio shell initialization smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke
