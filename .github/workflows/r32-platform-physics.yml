name: R32 Platform Physics Headless
on:
  pull_request:
    paths:
      - "sporebound/platform_physics.py"
      - "sporebound/physics_scenes.py"
      - "sporebound/game_project.py"
      - "drawtemp/studio/platform_collider_authoring.py"
      - "drawtemp/studio/platform_collider_qt.py"
      - "drawtemp/studio/genre_rules_qt.py"
      - "tests_standalone/test_platform_collider_authoring_r32.py"
      - "tests_standalone/test_platform_physics_r32.py"
      - "docs/drawtemp5/R32_PLATFORM_PHYSICS_FOUNDATION.md"
      - ".github/workflows/r32-platform-physics.yml"
  push:
    branches:
      - master
      - integration/consolidate-open-roadmap-20261019
permissions:
  contents: read
jobs:
  physics-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Deterministic movement/collision/replay R32
        run: python -m unittest tests_standalone.test_platform_physics_r32 -v
      - name: Canonical collision authoring and recovery R32.C
        run: python -m unittest tests_standalone.test_platform_collider_authoring_r32 -v
      - name: Preserve action rules R26
        run: python -m unittest tests_standalone.test_action_runtime_r26 -v
      - name: Preserve canonical CT session
        run: python -m unittest tests_standalone.test_game_session -v
  collision-editor-qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - run: python -m pip install -e ".[qt6]"
      - name: R32 Qt collider authoring and shared Gameplay smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_platform_collider_authoring_r32
          tests_standalone.test_r28c_gameplay_designers -v
      - name: Gameplay tab startup
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace gameplay
