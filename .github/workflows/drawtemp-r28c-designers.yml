name: DrawTemp R28.C gameplay designers

on:
  pull_request:
    paths:
      - 'drawtemp/studio/genre_rules_designer.py'
      - 'drawtemp/studio/genre_rules_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/rpg_database.py'
      - 'drawtemp/studio/r8_combat_ai.py'
      - 'tests_standalone/test_r28c_gameplay_designers.py'
      - '.github/workflows/drawtemp-r28c-designers.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/genre_rules_designer.py'
      - 'drawtemp/studio/genre_rules_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/studio/rpg_database.py'
      - 'drawtemp/studio/r8_combat_ai.py'
      - 'tests_standalone/test_r28c_gameplay_designers.py'
      - '.github/workflows/drawtemp-r28c-designers.yml'

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: R28.C real model/AI workflows
        run: python -m unittest tests_standalone.test_r28c_gameplay_designers -v
      - name: R8 and R25 regression
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp5_r8_database
          tests_standalone.test_drawtemp5_r8d
          tests_standalone.test_r25_foundation -v

  qt-designer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - run: python -m pip install -e ".[qt6]"
      - name: R28.C UI and R28.B shell integration
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_r28c_gameplay_designers
          tests_standalone.test_r28_profile_inspector
          tests_standalone.test_drawtemp5_r2 -v
      - name: Studio Gameplay workspace smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.qt_shell --smoke --workspace gameplay
