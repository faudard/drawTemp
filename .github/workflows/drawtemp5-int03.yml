name: DrawTemp 5 INT-03 Production Art Release
on:
  pull_request:
    paths:
      - 'assets/watercolor/**'
      - 'scripts/certify_int03_assets.py'
      - 'scripts/install_watercolor_pack.py'
      - 'scripts/generate_jeanne_motion.py'
      - 'tests_standalone/test_drawtemp5_int03.py'
      - '.github/workflows/drawtemp5-int03.yml'
      - '.github/workflows/jeanne-motion-publish.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int03-release-evidence:
    name: INT-03 / ${{ matrix.os }} / published bytes and rights
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: INT-03 safety and installer regression
        run: python -m unittest tests_standalone.test_drawtemp5_int03 tests_standalone.test_watercolor_release_gate -v
      - name: Certify checked-out 99 PNGs, animation bindings and licensed use
        run: python scripts/certify_int03_assets.py --root assets/watercolor --report int03-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int03-${{ matrix.os }}-${{ github.sha }}
          path: int03-report.json
          if-no-files-found: warn
