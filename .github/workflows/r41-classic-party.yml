name: R41 Classic RPG Party Foundation

on:
  pull_request:
    paths:
      - 'sporebound/classic_party.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'drawtemp/sdk/classic_party.py'
      - 'drawtemp/sdk/__init__.py'
      - 'tests_standalone/test_r41_classic_party.py'
      - 'tests_standalone/test_r41_party_studio.py'
      - 'tests_standalone/test_r41_encounter.py'
      - 'tests_standalone/test_r41_routed_encounter.py'
      - 'sporebound/scene_router.py'
      - 'tests_standalone/test_r41_encounter_qt.py'
      - 'sporebound/classic_encounter.py'
      - 'drawtemp/studio/encounter_authoring.py'
      - 'drawtemp/studio/encounter_qt.py'
      - 'tests_standalone/test_r41_party_qt.py'
      - 'drawtemp/studio/party_authoring.py'
      - 'drawtemp/studio/party_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/sdk/simulation.py'
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - '.github/workflows/r41-classic-party.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/classic_party.py'
      - 'sporebound/game_project.py'
      - 'sporebound/game_session.py'
      - 'drawtemp/sdk/classic_party.py'
      - 'drawtemp/sdk/__init__.py'
      - 'tests_standalone/test_r41_classic_party.py'
      - 'tests_standalone/test_r41_party_studio.py'
      - 'tests_standalone/test_r41_encounter.py'
      - 'tests_standalone/test_r41_routed_encounter.py'
      - 'sporebound/scene_router.py'
      - 'tests_standalone/test_r41_encounter_qt.py'
      - 'sporebound/classic_encounter.py'
      - 'drawtemp/studio/encounter_authoring.py'
      - 'drawtemp/studio/encounter_qt.py'
      - 'tests_standalone/test_r41_party_qt.py'
      - 'drawtemp/studio/party_authoring.py'
      - 'drawtemp/studio/party_qt.py'
      - 'drawtemp/studio/qt_shell.py'
      - 'drawtemp/sdk/simulation.py'
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  headless-party-and-ct-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Syntax and package imports
        run: python -m compileall -q sporebound/classic_party.py drawtemp/sdk/classic_party.py
      - name: R41 party contracts, state replay and strict migration
        run: python -m unittest tests_standalone.test_r41_classic_party -v
      - name: R41.B1 authoring transactions and Player persistence
        run: python -m unittest tests_standalone.test_r41_party_studio -v
      - name: R41.B2 actions, encounter authoring, replay and Player recovery
        run: python -m unittest tests_standalone.test_r41_encounter -v
      - name: R41.B3 routed transition and replay gates
        run: python -m unittest tests_standalone.test_r41_routed_encounter -v
      - name: R25 profiles and tactical unchanged
        run: python -m unittest tests_standalone.test_r25_foundation -v
      - name: Canonical GameSession and Jeanne replay
        run: python -m unittest tests_standalone.test_game_session -v

  party-studio-qt-offscreen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: R41.B1 Qt Party Studio smoke
        run: python -m unittest tests_standalone.test_r41_party_qt -v
      - name: R41.B2 Qt Encounter Studio smoke
        run: python -m unittest tests_standalone.test_r41_encounter_qt -v
