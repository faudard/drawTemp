name: DrawTemp R30.D Local Git Review
on:
  pull_request:
    paths:
      - 'drawtemp/studio/r30_git_review.py'
      - 'drawtemp/studio/r30_creator_qt.py'
      - 'tests_standalone/test_drawtemp_r30d_git.py'
      - 'tests_standalone/test_drawtemp_r30d_qt.py'
      - 'docs/drawtemp5/R30_D_GIT_REVIEW.md'
      - '.github/workflows/drawtemp-r30d-git.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-git:
    name: R30.D Git and semantic contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Test actual Git commits, bounds, explicit conflicts and R1 history
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r30_creator
          tests_standalone.test_drawtemp_r30b_pack_import
          tests_standalone.test_drawtemp_r30c_review
          tests_standalone.test_drawtemp_r30d_git
          tests_standalone.test_drawtemp5_r1_authoring
          -v
      - name: Verify unchanged Jeanne tactical replay
        run: >-
          python -m drawtemp.sdk.migration
          --verify-baseline docs/drawtemp5/reference-baseline.json

  qt-git:
    name: R30.D Qt offscreen Git dialog / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[qt6]"
      - name: Test Qt review and cross-PR regression
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: >-
          python -m unittest
          tests_standalone.test_drawtemp_r30c_qt
          tests_standalone.test_drawtemp_r30d_qt
          -v
      - name: Qt no-GPU Studio start
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.studio.r30_creator_qt --smoke
