name: DrawTemp R52.C1 Visibility Cache and CPU Scale

on:
  pull_request:
    paths:
      - '.github/workflows/r52-culling-cache.yml'
      - 'drawtemp/render/tile_chunks.py'
      - 'drawtemp/render/qt_viewport.py'
      - 'scripts/benchmark_r52_c1.py'
      - 'tests_standalone/test_r52c1_visibility_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r52c1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-cache:
    name: R52.C1 CPU / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editable DrawTemp
        run: python -m pip install .
      - name: R52.C1 three-mode culling, eviction and parity
        run: python -m unittest tests_standalone.test_r52c1_visibility_cache.VisibilityCacheTests tests_standalone.test_drawtemp5_r3b.ChunkAndLayerTests -v
      - name: CPU performance evidence (not GPU timing)
        run: python scripts/benchmark_r52_c1.py --size 128 --frames 80 --output r52c1-cpu.json
      - name: Publish CPU stats and bounded-cache counters
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52c1-${{ matrix.os }}
          path: r52c1-cpu.json
          if-no-files-found: warn
          retention-days: 30

  qt-property-smoke:
    name: R52.C1 Qt Quick cache exposure (software)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt Linux loaders
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install Qt 6.8.3
        run: python -m pip install ".[qt6]"
      - name: Real shared QQuickView cache property smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest tests_standalone.test_r52c1_visibility_cache.QtVisibilityStatsTests -v
