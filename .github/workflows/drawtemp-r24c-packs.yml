name: DrawTemp R24.C resource packs

on:
  pull_request:
    paths:
      - 'drawtemp/assets/packs.py'
      - 'drawtemp/export/r15.py'
      - 'tests_standalone/test_drawtemp5_r24c.py'
      - '.github/workflows/drawtemp-r24c-packs.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/assets/packs.py'
      - 'drawtemp/export/r15.py'
      - 'tests_standalone/test_drawtemp5_r24c.py'
      - '.github/workflows/drawtemp-r24c-packs.yml'

jobs:
  resource-pack-compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Pack, SDK and R15 regression
        run: python -m unittest tests_standalone.test_drawtemp5_r24c tests_standalone.test_drawtemp5_r24a tests_standalone.test_drawtemp5_r15 tests_standalone.test_drawtemp5_r15_creator
