name: DrawTemp R18.C Player Target UX

on:
  pull_request:
    paths:
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'tests_standalone/test_drawtemp5_r18c.py'
      - '.github/workflows/drawtemp5-r18c.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/player/controller.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'tests_standalone/test_drawtemp5_r18c.py'
      - '.github/workflows/drawtemp5-r18c.yml'

jobs:
  player-r18c:
    name: R18.C / Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install DrawTemp with Qt
        run: python -m pip install -e ".[qt6]"
      - name: Headless target UX and R12 regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m unittest tests_standalone.test_drawtemp5_r18c tests_standalone.test_drawtemp5_r12 tests_standalone.test_drawtemp5_r12_tactical -v
      - name: Real QML battle startup
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m drawtemp.player.qt_app --reference --smoke --smoke-scene battle
      - name: Existing title-to-resume QML journey (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -c "import tempfile, subprocess, sys; from pathlib import Path; d=tempfile.mkdtemp(prefix='r18c-player-'); rc=subprocess.call([sys.executable,'-m','drawtemp.player.qt_app','--reference','--save-dir',d,'--gui-journey']); sys.exit(rc)"
