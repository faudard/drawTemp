name: R35 Living World Simulator

on:
  pull_request:
    paths:
      - 'sporebound/living_world.py'
      - 'sporebound/game_session.py'
      - 'sporebound/game_project.py'
      - 'tests_standalone/test_r35_living_world.py'
      - 'tests_standalone/test_r35_factions_quests.py'
      - '.github/workflows/r35-living-world.yml'
  push:
    branches: [master]
    paths:
      - 'sporebound/living_world.py'
      - 'sporebound/game_session.py'
      - 'sporebound/game_project.py'
      - 'tests_standalone/test_r35_living_world.py'
      - 'tests_standalone/test_r35_factions_quests.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r35-headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: R35.A deterministic clock, schedules and save/load
        run: python -m unittest tests_standalone.test_r35_living_world -v
      - name: R35.B1 reputation and daily quest receipts
        run: python -m unittest tests_standalone.test_r35_factions_quests -v
      - name: R25 and legacy GameSession regressions
        run: python -m unittest tests_standalone.test_r25_scene_router tests_standalone.test_r25_fixed_realtime tests_standalone.test_game_session -v
