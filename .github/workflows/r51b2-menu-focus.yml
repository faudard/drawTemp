name: R51.B2 Gauge, Keyboard and Menu
on:
  pull_request:
    paths:
      - 'drawtemp/studio/r51_layout_draft.py'
      - 'drawtemp/studio/r51_designer_qt.py'
      - 'drawtemp/player/r51_hud.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'drawtemp/player/R51*.qml'
      - 'tests_standalone/test_r51b2_*.py'
      - 'tests_standalone/test_r51b_qt.py'
      - '.github/workflows/r51b2-menu-focus.yml'
  push:
    branches: [master]
    paths:
      - 'drawtemp/studio/r51_layout_draft.py'
      - 'drawtemp/studio/r51_designer_qt.py'
      - 'drawtemp/player/r51_hud.py'
      - 'drawtemp/player/qt_app.py'
      - 'drawtemp/player/Main.qml'
      - 'drawtemp/player/R51*.qml'
      - 'tests_standalone/test_r51b2_*.py'
permissions:
  contents: read
jobs:
  headless-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: R51 A/B/B2 and Player safe menus
        run: python -m unittest -v tests_standalone.test_r51a_ui_layout tests_standalone.test_r51b_layout_designer tests_standalone.test_r51b2_ui_navigation tests_standalone.test_player_hud_layout_r710
  qt-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      DRAWTEMP_R51_QT_GATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qt6]'
      - name: Widget tree, gauge inspector and focus GUI smoke (software only)
        run: python -m unittest -v tests_standalone.test_r51b_qt
