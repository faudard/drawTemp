[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawtemp-tactics"
version = "2.0.0a1"
description = "Jeanne d Arc tactical RPG, player and Game Studio (DrawTemp)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
qt6 = ["PySide6==6.8.3; python_version == '3.12'"]
art = ["Pillow>=10"]

[project.scripts]
drawtemp-qt6 = "drawtemp.platform.qt_bootstrap:main"
drawtemp-migrate5 = "drawtemp.sdk.legacy_migration:main"
drawtemp-studio5 = "drawtemp.studio.qt_shell:main"
drawtemp-iso5 = "drawtemp.render.qt_viewport:main"
drawtemp-event-studio = "drawtemp.studio.event_studio:main"
drawtemp-map-editor = "drawtemp.studio.map_editor:main"
drawtemp-character-studio = "drawtemp.studio.character_studio:main"
drawtemp-character-assets = "drawtemp.assets.characters:main"
drawtemp-jeanne-art = "drawtemp.assets.jeanne_art:main"
drawtemp-campaigns = "drawtemp.studio.campaign_window:main"
drawtemp-qt6-database = "drawtemp.studio.rpg_database_qt:main"
drawtemp-player5 = "drawtemp.player.qt_app:main"
drawtemp-creator5 = "drawtemp.export.cli:main"
drawtemp-cinematics-qt6 = "drawtemp.platform.qt_cinematics:main"
drawtemp = "sporebound.__main__:main"
sporebound = "drawtemp.legacy_alias:main"

[tool.setuptools.packages.find]
include = ["sporebound*", "drawtemp*"]

[tool.setuptools.package-data]
sporebound = ["content/*.json", "content/art/jeanne/*.png", "content/art/jeanne/*.jpg", "content/art/iso/*.png"]

drawtemp = ["render/*.qml", "player/*.qml", "studio/data/*.json"]
